<style>
@font-face{font-family:Inter;src:local("Inter")}
:root{--ink:#14181f;--mute:#5a6475;--line:#dde3ec;--bg:#ffffff;--paper:#eef1f6}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tools{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px max(16px,4vw);background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 16px -10px rgba(0,0,0,.3)}
.tools a,.tools button{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer}
.tools button.go{background:#2457c5;border-color:#2457c5;color:#fff}
.tools label{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer}
.only{font-size:14px;color:var(--mute)}.only a{color:#2457c5;font-weight:600}
.tools .hint{flex-basis:100%;margin:0;font-size:13px;color:var(--mute)}
.sheet{max-width:860px;margin:24px auto 60px;background:#fff;border-radius:6px;box-shadow:0 10px 40px -20px rgba(0,0,0,.35);padding:34px 40px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px solid #2457c5;padding-bottom:10px;margin-bottom:18px}
.head h1{margin:0;font-size:26px;letter-spacing:-.01em}
.head p{margin:0;color:var(--mute);font-size:13px;text-align:right}
.memo{margin:22px 0 10px;padding:8px 12px;border-radius:8px;border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);font-size:17px;font-weight:800;color:var(--c);break-after:avoid}
.card{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:12px 14px 10px;margin:0 0 12px;break-inside:avoid}
.card h2{margin:0;font-size:16.5px;line-height:1.3}
.where{margin:2px 0 8px;font-size:12.5px;color:var(--mute)}
.comp{font-size:11px;font-weight:700;color:#6a3fc9;background:#efe9fb;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.lead{margin:0 0 8px;color:#333b4a}
.lab{margin:8px 0 3px;font-size:13px;font-weight:600}
pre{margin:0;padding:8px 11px;background:#f3f5f9;border:1px solid #e1e6ef;border-radius:7px;font:12.5px/1.5 "DejaVu Sans Mono",Consolas,ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font:12.5px "DejaVu Sans Mono",Consolas,ui-monospace,monospace;background:#f0f2f6;border-radius:4px;padding:0 4px;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
table{border-collapse:collapse;width:100%;margin:8px 0 2px;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute)}
.note{margin:8px 0 0;padding:7px 10px;border-radius:7px;font-size:13.5px}
.tip{background:#fff6dc}.trap{background:#fdecec}.why{background:#e9f6f1}
.note b{margin-right:4px}
.empty{padding:30px 0;text-align:center;color:var(--mute)}
body.nowhy .why{display:none}
@page{size:A4;margin:14mm 13mm}
@media print{
 body{background:#fff}
 .tools{display:none}
 .sheet{max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}
}
@media (max-width:700px){.sheet{margin:12px 8px 40px;padding:20px 16px}.head{flex-direction:column;align-items:flex-start}.head p{text-align:left}}
</style>

<script>
/*DATA*/const DATA = [{"page":"python.html","memo":"Python : les bases du langage","c":"#2c4fcf","cards":[{"id":"trois-briques","t":"Les trois briques de tout programme","lead":"Un algorithme est une suite d'opérations dans l'ordre, comme une recette de cuisine.","tab":[["Brique","Ce qu'elle fait","En Python"],["La séquence","une opération après l'autre","des lignes l'une sous l'autre"],["La boucle","répéter sans réécrire","`for`, `while`"],["La condition","choisir selon la situation","`if`, `elif`, `else`"]],"why":"Presque tous les programmes sont une combinaison de ces trois briques. Les données manipulées sont les variables, les étapes sont les opérations.","sec":"Algorithmique et pseudo-code","grp":"Les bases"},{"id":"pseudo-code","t":"Écrire le pseudo-code avant le code","s":[["Le pseudo-code, en français","Demander le montant du panier\nSi le montant est supérieur ou égal à 50\n    Les frais de port sont de 0\nSinon\n    Les frais de port sont de 4.90\nAfficher le total"],["Sa traduction en Python","panier = float(input(\"Montant du panier : \"))\n\nif panier >= 50:\n    frais = 0\nelse:\n    frais = 4.90\n\nprint(\"Total à payer :\", panier + frais, \"€\")"]],"tip":"« À partir de 50 € » veut dire 50 compris : `>=`, pas `>`. Relis toujours l'énoncé pour savoir si la borne est incluse.","why":"On réfléchit d'abord à ce que le programme doit faire, et dans quel ordre, sans se soucier de la syntaxe. Chaque étape du pseudo-code doit se retrouver dans le code.","sec":"Algorithmique et pseudo-code","grp":"Les bases"},{"id":"afficher","t":"Afficher un résultat","s":[["Afficher (marche partout, même dans un script .py)","print(38 + 4)"],["Plusieurs valeurs : la virgule ajoute une espace","print(\"Vous avez\", age, \"ans\")"],["Changer le séparateur et la fin de ligne","print(\"Hello\", \"World\", sep=\", \", end=\"!\\n\")"]],"tip":"`sep` se place entre les valeurs (une espace par défaut), `end` après la dernière (un retour à la ligne par défaut).","why":"Dans un notebook, la dernière ligne d'une cellule s'affiche toute seule, mais seulement la dernière. Dans un vrai script `.py`, rien ne s'affiche sans `print()`. Prends l'habitude de l'écrire.","sec":"Variables et types","grp":"Les bases"},{"id":"types-base","t":"Créer une variable et connaître son type","s":[["Créer une variable : le = range une valeur","prix = 2.5"],["Connaître son type","type(prix)"]],"tab":[["Type","Contient","Comment le repérer"],["`int`","un nombre entier","`5` : pas de point"],["`float`","un nombre à virgule","`2.5` : un point"],["`str`","du texte","`\"Hello\"` : des guillemets"],["`bool`","vrai ou faux","`True` / `False`, avec une majuscule"]],"trap":"`true` sans majuscule n'existe pas : `NameError`. Et `6.0` vaut 6, mais c'est un `float` : la valeur et le type sont deux choses différentes.","why":"Python devine le type tout seul à partir de la valeur. Le type dit ce qu'on a le droit de faire : on additionne des nombres, pas du texte.","sec":"Variables et types","grp":"Les bases"},{"id":"nommer","t":"Bien nommer ses variables","s":[["Le style Python : snake_case (minuscules et _)","salaire_annuel = 36000"]],"tab":[["Règle","Exemple"],["commence par une lettre ou un _","`age`, `_total`"],["ensuite lettres, chiffres, _","`total_panier2`"],["pas d'espace ni de caractère spécial","`total panier` est refusé"],["pas un mot du langage","`for`, `return` sont refusés"]],"trap":"Évite `list`, `dict`, `str`, `print` comme noms : Python l'accepte, mais tu écrases l'outil du même nom pour la suite du notebook.","why":"Un bon nom est un commentaire qui ne devient jamais faux : `total_panier` se comprend tout seul, `x` non.","sec":"Variables et types","grp":"Les bases"},{"id":"convertir","t":"Convertir un type","s":[["Texte → entier","age = int(\"25\")"],["Entier → nombre à virgule","float(5)"],["Nombre → texte","str(36000)"],["Arrondir au plus proche","round(5.7)"],["Arrondir à 2 décimales","round(5.678, 2)"]],"tip":"`round(0.5)` donne 0 : en cas d'égalité, Python arrondit au nombre pair le plus proche.","trap":"`int(5.9)` donne 5 : `int()` **coupe** la partie décimale, il n'arrondit pas. Pour arrondir, c'est `round()`. Aucun message ne te préviendra.","sec":"Variables et types","grp":"Les bases"},{"id":"input","t":"Demander une valeur : input","s":[["Demander un nombre entier","age = int(input(\"Quel est ton âge ? \"))"],["Demander un nombre à virgule","prix = float(input(\"Prix HT : \"))"],["Demander du texte (pas de conversion)","nom = input(\"Ton nom ? \")"]],"tip":"L'espace après le `?` n'est pas décorative : sans elle, la saisie se colle au point d'interrogation. Le diaporama montre aussi `eval(input(...))` : préfère `int()` ou `float()`, `eval` exécute tout ce que l'utilisateur tape (complément).","why":"`input()` renvoie **toujours** du texte, même si on tape 25. Sans conversion, `age * 2` donne `\"2525\"` (le texte répété) au lieu de 50, sans erreur.","sec":"Variables et types","grp":"Les bases"},{"id":"echanger","t":"Échanger deux variables","s":[["Avec une variable temporaire","temporaire = x\nx = y\ny = temporaire"],["La version Python, en une ligne","x, y = y, x"]],"trap":"`x = y` puis `y = x` ne marche pas : la première ligne a déjà écrasé `x`. Une affectation détruit l'ancienne valeur, définitivement.","sec":"Variables et types","grp":"Les bases"},{"id":"arithmetique","t":"Calculer","s":[["La notation raccourcie : ajouter 5 au total","total += 5"]],"tab":[["Opérateur","Opération","Exemple","Résultat"],["`+` `-` `*`","addition, soustraction, multiplication","`5 * 2`","`10`"],["`/`","division","`5 / 2`","`2.5`"],["`//`","division entière","`5 // 2`","`2`"],["`%`","modulo (le reste)","`5 % 2`","`1`"],["`**`","puissance","`5 ** 2`","`25`"]],"trap":"`/` renvoie toujours un nombre à virgule : `12 / 3` donne `4.0`, pas `4`. Pour un entier, `12 // 3`.","sec":"Les opérateurs","grp":"Les bases"},{"id":"priorites","t":"Priorités et parenthèses","s":[["Le prix TTC : les parenthèses sont indispensables","prix_ttc = prix_ht * (1 + taux_tva / 100)"]],"tip":"Un pourcentage tapé « 20 » se divise par 100 avant usage : `prix * 20` multiplierait le prix par vingt.","why":"Python calcule `**` d'abord, puis `*` et `/`, puis `+` et `-`. Sans parenthèses, `prix_ht * 1 + taux_tva / 100` donnerait un résultat absurde, sans aucun message.","sec":"Les opérateurs","grp":"Les bases"},{"id":"div-mod","t":"// et % : ce qui rentre et ce qui reste","s":[["Convertir des secondes en heures, minutes, secondes","heures = total_secondes // 3600\nreste = total_secondes % 3600\nminutes = reste // 60\nsecondes = reste % 60"],["Tester si un nombre est pair","nombre % 2 == 0"],["Le dernier chiffre d'un nombre","nombre % 10"]],"trap":"Calculer les minutes sur le total au lieu du reste : 12 334 secondes donneraient 205 minutes au lieu de 25.","why":"`//` dit combien de fois ça rentre, `%` dit ce qui reste. Ensemble, ils épuisent le nombre de départ : on retire la plus grosse unité, puis on recommence sur le reste.","sec":"Les opérateurs","grp":"Les bases"},{"id":"comparer","t":"Comparer deux valeurs","s":[["Une comparaison se range dans une variable","est_plus_grand = a > b"]],"tab":[["Opérateur","Veut dire"],["`>` / `>=`","supérieur / supérieur ou égal"],["`<` / `<=`","inférieur / inférieur ou égal"],["`==`","égal"],["`!=`","différent"]],"trap":"Un seul `=` range, deux `==` comparent. Et `0.1 + 0.2 == 0.3` vaut `False` : les nombres à virgule sont stockés de façon approchée.","why":"Une comparaison n'est pas une question : c'est une valeur, `True` ou `False`, comme `2 + 3` vaut 5.","sec":"Les opérateurs","grp":"Les bases"},{"id":"and-or-not","t":"Combiner des conditions : and, or, not","s":[["Les deux conditions (and)","livraison_gratuite = est_membre and panier >= 50"],["Au moins une des deux (or)","remise = montant > 100 or nb_articles >= 10"],["Le contraire (not)","not (5 <= 10)"]],"tab":[["Opérateur","Vrai quand…"],["`and`","les deux sont vraies"],["`or`","au moins une est vraie"],["`not`","l'expression est fausse (on inverse)"]],"trap":"`and` passe avant `or` : `a or b and c` se lit `a or (b and c)`. Mets toujours des parenthèses. Et le texte `\"non\"` compte comme vrai : compare avec `reponse == \"oui\"`.","sec":"Les opérateurs","grp":"Les bases"},{"id":"if-elif-else","t":"if, elif, else","s":[["Trois cas, de haut en bas","if achat < 100:\n    remise = 0\nelif achat <= 500:\n    remise = achat * 0.05\nelse:\n    remise = achat * 0.08\n\nprint(\"Remise :\", remise, \"€\")"]],"tip":"Calcule dans les branches, affiche une seule fois après : si tu changes l'affichage, tu le changes à un seul endroit.","trap":"N'oublie pas les `:` en fin de ligne, et décale le bloc de 4 espaces : c'est l'indentation qui dit ce qui appartient au `if`.","why":"Python teste les conditions dans l'ordre et s'arrête à la **première vraie** : les suivantes ne sont même pas lues. Le `elif` n'a donc pas besoin de répéter `achat >= 100`.","sec":"Les conditions","grp":"Contrôler le déroulé"},{"id":"ordre-conditions","t":"Ordonner ses conditions","s":[["Du plus restrictif au plus large","if note < 10:\n    print(\"Ajourné\")\nelif note >= 16:\n    print(\"Très bien\")\nelif note >= 14:\n    print(\"Bien\")\nelif note >= 12:\n    print(\"Assez bien\")\nelse:\n    print(\"Passable\")"]],"tip":"Termine toujours une série de `elif` par un `else`, même pour signaler un cas imprévu. Sans lui, rien ne s'affiche, sans erreur.","trap":"Si `note >= 10` est testé en premier, une note de 18 affiche « Passable » : la première condition vraie gagne. Le programme tourne et ment.","sec":"Les conditions","grp":"Contrôler le déroulé"},{"id":"bornes","t":"La borne est-elle incluse ?","tab":[["L'énoncé dit…","On écrit"],["« à partir de 50 », « au moins 50 »","`>= 50`"],["« plus de 50 »","`> 50`"],["« jusqu'à 500 inclus »","`<= 500`"],["« moins de 10 »","`< 10`"]],"tip":"Python accepte les comparaisons chaînées : `if x <= y <= z:` se lit comme en maths.","trap":"`<` au lieu de `<=` : un achat de exactement 500 € tombe dans la mauvaise tranche. Teste toujours les valeurs pile sur les bornes.","sec":"Les conditions","grp":"Contrôler le déroulé"},{"id":"for-ou-while","t":"for ou while ?","tab":[["","`for`","`while`"],["Nombre de tours","connu d'avance","inconnu"],["Ce qui arrête","la fin de la séquence","une condition devenue fausse"],["Exemple","les nombres de 0 à 1000","additionner tant que la somme ≤ 300"]],"why":"« Je sais combien de tours je vais faire » → `for`. « C'est une condition qui décide » → `while`.","sec":"Les boucles","grp":"Contrôler le déroulé"},{"id":"range","t":"Compter avec range","s":[["De 0 à 4","for i in range(5):\n    print(i)"],["De 1 à 10","range(1, 11)"],["De 3 à 30, de 3 en 3","range(3, 31, 3)"],["À l'envers : 5, 3","range(5, 2, -2)"]],"trap":"La borne de fin est **toujours exclue** : `range(1, 10)` s'arrête à 9. Pour aller jusqu'à 10, écris `range(1, 11)`.","sec":"Les boucles","grp":"Contrôler le déroulé"},{"id":"accumulateur","t":"L'accumulateur : faire un total","s":[["La somme de 1 à 100","total = 0\nfor nombre in range(1, 101):\n    total += nombre\nprint(total)"]],"tab":[["On accumule…","On démarre à"],["une somme, un compteur","`0`"],["un produit","`1`"],["du texte","`\"\"`"],["une liste","`[]`"]],"trap":"Un produit qui démarre à 0 vaut 0 pour toujours : 0 × n'importe quoi = 0.","why":"L'accumulateur se crée **avant** la boucle, grandit **dans** la boucle, s'affiche **après**. Déplace une seule ligne d'un cran et le résultat est faux.","sec":"Les boucles","grp":"Contrôler le déroulé"},{"id":"while","t":"while : tant que","s":[["Ajouter les carrés tant que la somme ne dépasse pas 300","somme = 0\nnombre = 0\nwhile somme <= 300:\n    nombre += 1\n    somme += nombre ** 2"]],"trap":"Si rien ne modifie la condition dans la boucle, elle tourne à l'infini. Et si la condition est fausse dès le départ, la boucle ne s'exécute jamais.","why":"La condition est testée **avant** chaque tour. Le dernier tour s'exécute en entier : c'est pour ça que la somme finale dépasse 300 (385).","sec":"Les boucles","grp":"Contrôler le déroulé"},{"id":"break-continue","t":"break et continue","s":[["Arrêter à 30, sauter les multiples de 7","for numero in range(1, 51):\n    if numero == 30:\n        break\n    if numero % 7 == 0:\n        continue\n    print(numero, end=\" \")"]],"tab":[["Instruction","Effet"],["`break`","quitte la boucle pour de bon"],["`continue`","abandonne le tour en cours, passe au suivant"]],"tip":"Place toujours la condition de sortie (`break`) avant les `continue` : sinon elle peut devenir inatteignable.","sec":"Les boucles","grp":"Contrôler le déroulé"},{"id":"imbriquees","t":"Boucles imbriquées","s":[["Une pyramide de nombres","for i in range(1, 6):\n    for j in range(1, i + 1):\n        print(j, end=\"\")\n    print()"]],"trap":"Décale le dernier `print()` d'un cran vers la droite et tu passes à la ligne après chaque chiffre : l'indentation décide de ce qui se répète.","why":"La boucle extérieure fait une ligne par tour, la boucle intérieure remplit la ligne. `end=\"\"` empêche le retour à la ligne ; le `print()` vide passe à la ligne suivante.","sec":"Les boucles","grp":"Contrôler le déroulé"},{"id":"commenter","t":"Écrire un commentaire utile","s":[["Un commentaire qui explique le pourquoi","# TVA à 20 % : taux standard en France (5,5 % pour les livres)\nprix_ttc = prix_ht * 1.2"]],"tip":"Un nombre écrit en dur (1.2, 50, 0.05) mérite presque toujours un commentaire : d'où sort-il ?","trap":"Un commentaire faux est pire que pas de commentaire : quand tu modifies une ligne, relis celui qui l'accompagne.","why":"Un commentaire explique le **pourquoi**, jamais le **quoi** : le code dit déjà ce qu'il fait. `# on multiplie par 1.2` n'apprend rien.","sec":"Commenter et débugger","grp":"Contrôler le déroulé"},{"id":"lire-erreur","t":"Lire un message d'erreur","lead":"Le message se lit **par la fin** : le type d'erreur, puis la ligne, puis le code.","tab":[["Erreur","Veut dire","Cause typique"],["`SyntaxError`","Python ne comprend pas la phrase","`:` ou parenthèse oubliés"],["`IndentationError`","indentation incohérente","espaces et tabulations mélangés"],["`NameError`","ce nom n'existe pas","faute de frappe, cellule pas exécutée"],["`TypeError`","opération impossible entre ces types","`\"5\" + 5`, `int()` oublié après `input()`"],["`ValueError`","bon type, valeur impossible","`int(\"bonjour\")`"],["`ZeroDivisionError`","division par zéro","une liste vide, un dénominateur à 0"],["`IndexError`","position inexistante","`liste[3]` sur 3 éléments"]],"trap":"La ligne signalée est celle où ça a **cassé**, pas toujours celle de l'erreur. Un `input()` non converti à la ligne 1 fait planter le calcul de la ligne 12 : remonte.","sec":"Commenter et débugger","grp":"Contrôler le déroulé"},{"id":"print-debug","t":"Débugger avec des print étiquetés","s":[["Encadrer la ligne suspecte","print(\"total avant :\", total)\ntotal += article\nprint(\"total après :\", total)"],["Voir les espaces cachées et les guillemets","print(repr(texte))"]],"tip":"Avant de débugger, formule ce que tu attends : « total devrait valoir 60, il vaut 30 ». Et enlève les `print()` une fois le bug trouvé.","why":"Quand le code tourne mais donne un résultat faux, les `print()` te montrent le film, pas seulement la dernière image. `repr()` affiche `'Data '` avec ses guillemets : l'espace finale devient visible.","sec":"Commenter et débugger","grp":"Contrôler le déroulé"},{"id":"chaining","t":"Enchaîner des méthodes (chaining)","s":[["Nettoyer un en-tête en une ligne","colonnes = entete.strip().lower().split(\";\")"],["Une longue chaîne : entre parenthèses, une étape par ligne","resultat = (phrase\n            .lower()\n            .replace(\"us\", \"es\")\n            .replace(\"w\", \"u\"))"]],"trap":"`.split()` change le texte en liste : il vient **en dernier**. `entete.split(\";\").lower()` donne `AttributeError: 'list' object has no attribute 'lower'`.","why":"Chaque méthode s'applique au résultat de la précédente. À chaque point, demande-toi : « j'ai quoi entre les mains, du texte ou une liste ? »","sec":"Commenter et débugger","grp":"Contrôler le déroulé"},{"id":"creer-chaine","t":"Écrire une chaîne","s":[["Guillemets ou apostrophes : c'est pareil","str_1 = \"Salut wilder !\""],["Une apostrophe dans le texte : entre guillemets","phrase = \"Je pense qu'il a raison\""],["Sur plusieurs lignes : triples guillemets","texte = \"\"\"Première ligne\nDeuxième ligne\"\"\""]],"sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"mesurer-chaine","t":"Mesurer, parcourir, chercher","s":[["Le nombre de caractères (espaces comprises)","len(\"Data Analyst\")"],["Parcourir caractère par caractère","for caractere in \"Data\":\n    print(caractere)"],["Tester la présence d'un mot","\"Data\" in \"Data Analyst\""]],"trap":"`in` est sensible à la casse : `\"data\" in \"Data Analyst\"` vaut `False`. Pour comparer, normalise d'abord avec `.lower()`.","sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"slicing","t":"Sélectionner : position et tranches","s":[["Le premier caractère","s[0]"],["Le dernier","s[-1]"],["Les 2 premiers","s[0:2]"],["À partir du 4e jusqu'à la fin","s[3:]"],["Les 5 derniers","s[-5:]"],["La chaîne à l'envers","s[::-1]"]],"tip":"Pense aux bornes comme aux **coupures entre** les caractères : `s[1:4]` prend tout ce qui est entre la coupure 1 et la coupure 4.","trap":"La dernière position est `len(s) - 1` : `s[len(s)]` donne une `IndexError`. Compter depuis la fin (`[-5:]`) est plus solide si la longueur change.","why":"On compte à partir de 0. Dans `s[a:b]`, `a` est inclus et `b` exclu : `b - a` donne le nombre de caractères obtenus.","sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"immuable","t":"Une chaîne ne se modifie pas","s":[["Ranger le résultat pour le garder","mot = mot.replace(\"b\", \"m\")"]],"trap":"`mot[0] = \"m\"` donne `TypeError: 'str' object does not support item assignment`. Et `mot.replace(\"b\", \"m\")` tout seul ne fait rien, sans erreur : c'est le bug le plus fréquent.","why":"Une chaîne est figée. Toutes ses méthodes fabriquent une **copie** : sans `mot =`, la copie est créée puis perdue.","sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"methodes-chaine","t":"Les méthodes à connaître","s":[["Enlever les espaces au début et à la fin","s.strip()"],["Tout en majuscules / minuscules","s.upper()"],["Une majuscule à chaque mot","s.title()"],["Une majuscule au premier caractère seulement","s.capitalize()"],["Remplacer (toutes les occurrences)","s.replace(\"a\", \"@\")"],["Combien de fois « a » apparaît","s.count(\"a\")"],["La position de la première occurrence","s.find(\"Analyst\")"],["Écraser les espaces multiples du milieu","\" \".join(s.split())"]],"trap":"`.find()` renvoie `-1` si le texte est absent, et `-1` est aussi une position valide (le dernier caractère). Et `.strip()` ne touche jamais au milieu de la chaîne.","sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"split-join","t":"Découper et recoller : split / join","s":[["Texte → liste","\"nom;prenom;ville\".split(\";\")"],["Liste → texte","\", \".join([\"pain\", \"lait\", \"oeufs\"])"],["Découper puis ranger dans des variables","nom, prenom, email = ligne.split(\";\")"]],"trap":"`.join()` s'écrit sur le **séparateur** : `\", \".join(liste)`, pas `liste.join(\", \")`. Et il n'accepte que du texte : `\", \".join(str(p) for p in prix)` pour des nombres.","sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"f-string","t":"Construire une phrase : la f-string","s":[["Insérer des variables entre accolades","print(f\"{nom} a {age} ans\")"],["Un calcul directement dans les accolades","print(f\"L'an prochain : {age + 1}\")"],["Afficher sur 2 chiffres : 03:25:34","print(f\"{heures:02d}:{minutes:02d}:{secondes:02d}\")"]],"trap":"`\"J'ai \" + age + \" ans\"` donne `TypeError: can only concatenate str (not \"int\") to str`.","why":"La f-string convertit toute seule les nombres en texte et ressemble au résultat final. Avec `+`, il faut des `str()` partout.","sec":"Les chaînes de caractères","grp":"Les structures de données"},{"id":"creer-liste","t":"Créer et lire une liste","s":[["Créer","courses = [\"pain\", \"lait\", \"oeufs\", \"café\", \"riz\"]"],["Le premier / le dernier","courses[0]"],["Les 2 derniers (une tranche renvoie une liste)","courses[-2:]"],["Le nombre d'éléments","len(courses)"],["Tester la présence","\"lait\" in courses"],["La position d'un élément","courses.index(\"café\")"]],"trap":"Le 3e élément est en position 2. Et `.index()` plante si l'élément est absent : teste avec `in` avant.","sec":"Les listes","grp":"Les structures de données"},{"id":"modifier-liste","t":"Ajouter, remplacer, supprimer","s":[["Remplacer (la taille ne change pas)","courses[3] = \"thé\""],["Ajouter à la fin","courses.append(\"pommes\")"],["Insérer en 2e position (tout se décale)","courses.insert(1, \"beurre\")"],["Supprimer une valeur (sa 1re occurrence)","courses.remove(\"riz\")"],["Supprimer une position et récupérer l'élément","retire = courses.pop(0)"],["Supprimer une position","del courses[0]"]],"tab":[["Outil","On lui donne","Renvoie l'élément ?"],["`.remove(x)`","une **valeur**","non"],["`.pop(i)`","une **position**","oui"],["`del liste[i]`","une **position**","non"]],"trap":"`.remove(0)` cherche la **valeur** 0, pas la première position. S'il y a un 0 dans la liste, il supprime le zéro, sans erreur.","sec":"Les listes","grp":"Les structures de données"},{"id":"liste-none","t":"Le piège : une liste se modifie sur place","s":[["La bonne écriture : rien à gauche","courses.append(\"riz\")"]],"trap":"`courses = courses.append(\"riz\")` met `None` dans `courses` : la liste est perdue. Même piège avec `.sort()`, `.insert()`, `.remove()`, `.reverse()`.","why":"Une liste est **mutable** : ses méthodes la modifient directement et ne renvoient rien (`None`). C'est l'inverse des chaînes.","sec":"Les listes","grp":"Les structures de données"},{"id":"trier-liste","t":"Trier : sorted ou sort","s":[["Une nouvelle liste triée, l'originale intacte","triee = sorted(notes)"],["Trier la liste elle-même","notes.sort()"],["Du plus grand au plus petit","sorted(notes, reverse=True)"],["Les 3 meilleurs","sorted(scores, reverse=True)[:3]"]],"tab":[["","`sorted(l)`","`l.sort()`"],["L'originale","intacte","modifiée"],["Renvoie","la liste triée","`None`"],["S'applique à","tout (texte, tuple…)","une liste seulement"]],"tip":"Dans le doute, prends `sorted()` : ne rien détruire est le choix le plus sûr. Attention, les majuscules passent avant les minuscules.","sec":"Les listes","grp":"Les structures de données"},{"id":"parcourir-liste","t":"Parcourir : trois façons","s":[["Les valeurs seules","for note in notes:\n    print(note)"],["Les positions","for i in range(len(notes)):\n    print(i, notes[i])"],["Les deux, numérotés à partir de 1","for i, note in enumerate(notes, start=1):\n    print(f\"Note n°{i} : {note}\")"]],"trap":"Avec `enumerate`, la position vient **en premier**. `for note, i in enumerate(notes)` ne plante pas, mais range les numéros dans `note`.","sec":"Les listes","grp":"Les structures de données"},{"id":"copier-liste","t":"Copier une liste","s":[["Une vraie copie","copie = original.copy()"],["Autres écritures équivalentes","copie = original[:]"]],"tip":"`a is b` : même objet ? `a == b` : même contenu ? Une bonne copie est `==` sans être `is`.","trap":"`copie = original` ne copie rien : c'est un deuxième nom pour la **même** liste. Modifier l'une modifie l'autre, sans aucun message.","sec":"Les listes","grp":"Les structures de données"},{"id":"liste-de-listes","t":"Des listes dans une liste","s":[["Un tableau : une ligne par mois","ventes = [[\"janvier\", 120, 340], [\"février\", 95, 410], [\"mars\", 180, 260]]"],["Ligne 1, colonne 2","ventes[1][2]"],["Parcourir ligne par ligne","for ligne in ventes:\n    print(ligne[0], \":\", ligne[1] + ligne[2])"]],"why":"Le premier crochet choisit la ligne (une liste), le second la colonne dans cette ligne. C'est l'ancêtre direct d'un tableau pandas.","sec":"Les listes","grp":"Les structures de données"},{"id":"filtrer-liste","t":"Construire une nouvelle liste","s":[["Garder les températures au-dessus de 20","chaudes = []\nfor t in temperatures:\n    if t > 20:\n        chaudes.append(t)"],["La même chose en une ligne (compréhension)","chaudes = [t for t in temperatures if t > 20]"]],"trap":"Ne supprime jamais des éléments d'une liste pendant que tu la parcours : tout se décale et la boucle en saute, sans erreur. Construis une nouvelle liste.","sec":"Les listes","grp":"Les structures de données"},{"id":"outils-liste","t":"Fonctions utiles sur les listes","s":[["Somme, maximum, minimum","sum(notes), max(notes), min(notes)"],["La moyenne","sum(notes) / len(notes)"],["Combien de fois une valeur","notes.count(8)"],["Coller deux listes","[1, 2] + [3, 4]"],["Une liste de 4 zéros","[0] * 4"],["Transformer en liste","list(range(5))"]],"trap":"La moyenne d'une liste vide plante : `ZeroDivisionError`. Prévois le cas avec `if len(notes) == 0:`.","sec":"Les listes","grp":"Les structures de données"},{"id":"creer-dict","t":"Créer et lire un dictionnaire","s":[["Créer : des paires clé: valeur","prix = {\"Burger\": 12.5, \"Salade\": 9.0}"],["Lire une valeur","prix[\"Burger\"]"],["Lire sans risque d'erreur","prix.get(\"Pizza\")"],["Avec une valeur de repli","prix.get(\"Pizza\", 0)"],["Tester si une clé existe","\"Burger\" in prix"]],"trap":"`prix[\"Pizza\"]` sur une clé absente donne `KeyError`. Et `in` teste les **clés** : pour les valeurs, `\"Lyon\" in d.values()`.","why":"Une liste range par **position**, un dictionnaire par **étiquette** : on demande ce qu'on veut par son nom. C'est la structure la plus utilisée en data (JSON, API…).","sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"modifier-dict","t":"Ajouter, modifier, supprimer","s":[["Ajouter ou remplacer : même écriture","prix[\"Tiramisu\"] = 6.5"],["Ajouter par méthode (plusieurs d'un coup)","prix.update({\"Café\": 2.0, \"Thé\": 2.5})"],["Supprimer et récupérer la valeur","retire = prix.pop(\"Salade\")"],["Supprimer la dernière paire ajoutée","prix.popitem()"],["Supprimer","del prix[\"Burger\"]"],["Fusionner deux dictionnaires","fusion = d1 | d2"]],"tip":"`.pop(\"cle\")` renvoie la valeur, `.popitem()` renvoie la paire en tuple. `del` est un mot-clé : il ne renvoie rien.","why":"`d[\"cle\"] = valeur` **ajoute** si la clé n'existe pas, **remplace** si elle existe. Pratique, mais c'est aussi comme ça qu'on écrase une valeur sans s'en rendre compte.","sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"parcourir-dict","t":"Parcourir un dictionnaire","s":[["Les clés","for plat in prix:\n    print(plat)"],["Les valeurs","sum(prix.values())"],["Les deux à la fois","for plat, tarif in prix.items():\n    print(f\"{plat} coûte {tarif} €\")"]],"tab":[["J'écris","La boucle me donne"],["`for x in d:`","les clés"],["`for x in d.values():`","les valeurs"],["`for x in d.items():`","les paires, en tuples"],["`for cle, valeur in d.items():`","les deux, déballées"]],"sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"compter-dict","t":"Compter avec un dictionnaire","s":[["Compter chaque élément","comptes = {}\nfor element in liste:\n    comptes[element] = comptes.get(element, 0) + 1"],["Le même calcul avec Counter","from collections import Counter\nCounter(liste).most_common(1)"]],"trap":"`comptes = {}` doit être **avant** la boucle : dedans, le dictionnaire est vidé à chaque tour.","why":"Au premier passage, la clé n'existe pas : `.get(element, 0)` renvoie 0 au lieu de planter, puis on ajoute 1.","sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"dict-imbrique","t":"Des dictionnaires dans un dictionnaire","s":[["Descendre niveau par niveau","maison[\"mobilier\"][\"salon\"]"],["Une liste comme valeur","salons[\"salon_vert\"][0]"]],"tip":"Avant chaque crochet, demande-toi ce que tu viens d'obtenir : un dictionnaire → une clé, une liste → une position.","sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"cles-autorisees","t":"Quelles clés sont autorisées ?","tab":[["Type","Clé valide ?"],["`str`, `int`, `float`, `bool`","oui"],["`tuple`","oui"],["`list`, `dict`, `set`","non : `TypeError: unhashable type`"]],"why":"Une clé doit être stable, donc non modifiable. Si on pouvait modifier une liste après l'avoir utilisée comme clé, le dictionnaire ne retrouverait plus sa valeur.","sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"trier-dict","t":"Trier un dictionnaire","s":[["Les clés, par ordre alphabétique","sorted(prix)"],["Les clés, du moins cher au plus cher","sorted(prix, key=prix.get)"],["Les paires, du plus cher au moins cher","sorted(prix.items(), key=lambda paire: paire[1], reverse=True)"]],"why":"Parcourir un dictionnaire, c'est parcourir ses clés : `sorted()` trie donc les clés. `key=` dit sur quoi trier.","sec":"Les dictionnaires","grp":"Les structures de données"},{"id":"creer-tuple","t":"Créer un tuple","s":[["Un tuple : comme une liste qu'on ne peut plus modifier","plat = (\"Burger\", 13.0)"],["Un tuple d'un seul élément : la virgule","un_tuple = (\"Burger\",)"],["Passer d'une liste à un tuple","tuple(ma_liste)"]],"tip":"Immuable ne veut pas dire constant : on peut réaffecter le nom (`plat = (\"Salade\", 9.0)`). Et si un tuple contient une liste, la liste, elle, reste modifiable.","trap":"C'est la **virgule** qui fait le tuple, pas les parenthèses : `(\"Burger\")` n'est qu'une chaîne.","sec":"Les tuples","grp":"Les structures de données"},{"id":"depaqueter","t":"Dépaqueter un tuple","s":[["Répartir dans plusieurs variables","nom, prix = plat"],["Échanger deux variables","a, b = b, a"],["Parcourir deux listes en parallèle","for nom, tarif in zip(plats, tarifs):\n    print(f\"{nom} : {tarif} €\")"]],"trap":"Le nombre de variables doit correspondre : `a, b = (1, 2, 3)` donne `ValueError: too many values to unpack`.","why":"C'est le mécanisme derrière `for cle, valeur in d.items()` et `enumerate` : chaque tour fournit un tuple, que Python répartit dans tes variables.","sec":"Les tuples","grp":"Les structures de données"},{"id":"remplacer-tuple","t":"« Modifier » un tuple : en créer un autre","s":[["Remplacer l'élément en position 3","inventaire = inventaire[:3] + (\"atelier\",) + inventaire[4:]"]],"trap":"Sans le `+ 1` (`[4:]` et non `[3:]`), l'ancien élément est conservé et le nouveau s'insère devant. Vérifie avec `len()`.","why":"On ne modifie pas un tuple : on en assemble un nouveau à partir de tranches, et on lui donne le même nom.","sec":"Les tuples","grp":"Les structures de données"},{"id":"quand-tuple","t":"Quand choisir un tuple ?","tab":[["Cas","Exemple"],["des données qui ne doivent pas changer","des coordonnées, une date"],["une clé de dictionnaire composée","`{(\"Lyon\", \"2026-09\"): 1240}`"],["une fonction qui renvoie plusieurs valeurs","`return total, phrase`"]],"why":"Si quelqu'un essaie de modifier un tuple, Python refuse tout de suite, au lieu de laisser passer un bug silencieux.","sec":"Les tuples","grp":"Les structures de données"},{"id":"set-doublons","t":"Enlever les doublons, compter les valeurs différentes","s":[["Les valeurs uniques","set(commandes)"],["Combien de valeurs différentes","len(set(commandes))"],["Un set vide","vide = set()"]],"trap":"`{}` tout seul crée un **dictionnaire** vide, pas un set. Un set n'a pas de position (`mon_set[0]` plante) et son ordre d'affichage n'est pas un tri.","why":"Un set ne garde ni l'ordre ni les doublons : c'est l'outil des questions « combien de clients **différents** ? ».","sec":"Les sets","grp":"Les structures de données"},{"id":"set-modifier","t":"Ajouter et retirer","s":[["Ajouter un élément","clients.add(\"Tom\")"],["Ajouter toute une collection","clients.update(nouveaux)"],["Retirer, sans erreur si absent","clients.discard(\"Nadia\")"],["Retirer, avec erreur si absent","clients.remove(\"Yann\")"]],"tip":"`discard()` quand l'absence est normale, `remove()` quand l'absence est un bug.","trap":"`clients.union(nouveaux)` ne modifie pas `clients` : elle renvoie un nouveau set, perdu s'il n'est pas rangé. Pour ajouter sur place, c'est `update()`.","sec":"Les sets","grp":"Les structures de données"},{"id":"set-comparer","t":"Comparer deux groupes","s":[["Venus les deux mois (en commun)","aout & septembre"],["Tous, sans doublon","aout | septembre"],["Venus en août seulement","aout - septembre"],["Venus un seul des deux mois","aout ^ septembre"],["Tous les éléments sont-ils dans l'autre ?","commande.issubset(carte)"]],"tab":[["Opérateur","Méthode","Question"],["`&`","`.intersection()`","qui est dans les deux ?"],["`|`","`.union()`","qui est dans au moins un ?"],["`-`","`.difference()`","qui est dans le premier, pas le second ?"],["`^`","`.symmetric_difference()`","qui n'est que dans un seul ?"]],"tip":"Tu retrouveras ces opérations en SQL : `INNER JOIN`, `UNION`, `EXCEPT`.","trap":"`-` n'est pas symétrique : `aout - septembre` et `septembre - aout` ne donnent pas le même résultat.","sec":"Les sets","grp":"Les structures de données"},{"id":"choisir-collection","t":"Choisir la bonne collection","tab":[["Type","S'écrit","Ordonné","Doublons","Modifiable","Quand l'utiliser"],["`list`","`[1, 2, 2]`","oui","oui","oui","le choix par défaut"],["`tuple`","`(1, 2, 2)`","oui","oui","non","protéger des valeurs fixes"],["`set`","`{1, 2}`","non","non","oui","valeurs distinctes, comparer des groupes"],["`dict`","`{\"a\": 1}`","oui","clés uniques","oui","retrouver une valeur par son nom"]],"sec":"Les sets","grp":"Les structures de données"},{"id":"creer-fonction","t":"Créer et appeler une fonction","s":[["Définir","def somme(nombre_1, nombre_2):\n    return nombre_1 + nombre_2"],["Appeler, et ranger le résultat","resultat = somme(4, 7)"]],"trap":"Pas d'`input()` dans une fonction : un paramètre reçoit sa valeur de celui qui appelle, pas de l'humain devant l'écran. Et le nombre d'arguments doit correspondre aux paramètres.","why":"Une fonction est un petit programme réutilisable. Les **paramètres** sont les noms entre les parenthèses de la définition ; les **arguments** sont les valeurs données à l'appel.","sec":"Les fonctions","grp":"Structurer son code"},{"id":"return-print","t":"return, pas print","tab":[["","`print(...)`","`return ...`"],["Affiche à l'écran","oui","oui, dans un notebook"],["Rend la valeur à celui qui appelle","non","oui"],["`resultat = f()` contient","`None`","la valeur"],["On peut réutiliser le résultat","non","oui"]],"trap":"`return` **arrête** la fonction : deux `return` à la suite, et le second ne s'exécute jamais.","why":"Une fonction qui affiche au lieu de renvoyer donne la même sortie à l'écran, mais son résultat est `None` : impossible de le réutiliser (`f() * 2` plante).","sec":"Les fonctions","grp":"Structurer son code"},{"id":"plusieurs-retours","t":"Renvoyer plusieurs valeurs","s":[["Renvoyer deux valeurs","def produit_et_mot(a, b, mot):\n    return a * b, mot"],["Les récupérer dans deux variables","produit, mot = produit_et_mot(6, 7, \"data\")"]],"why":"Une fonction ne renvoie qu'un seul objet : la virgule fabrique un tuple qui contient les deux valeurs.","sec":"Les fonctions","grp":"Structurer son code"},{"id":"selon-cas","t":"Renvoyer selon le cas","s":[["Calculer, classer, un seul return à la fin","def somme_et_situation(a, b):\n    total = a + b\n    if total < 10:\n        phrase = \"La somme est inférieure à 10.\"\n    elif total <= 50:\n        phrase = \"La somme est entre 10 et 50.\"\n    else:\n        phrase = \"La somme est supérieure à 50.\"\n    return total, phrase"]],"tip":"Teste toujours une fonction sur plusieurs valeurs, et surtout sur les bornes (10 et 50 ici) : c'est là que le code casse.","sec":"Les fonctions","grp":"Structurer son code"},{"id":"docstring","t":"Documenter une fonction","s":[["La docstring : juste sous le def","def moyenne(liste):\n    \"\"\"Calcule la moyenne des valeurs d'une liste.\n\n    Paramètre : liste (list) - une liste de nombres\n    Retour    : float - la moyenne, arrondie à 2 décimales\n    \"\"\"\n    return round(sum(liste) / len(liste), 2)"]],"tip":"`help(moyenne)` affiche ensuite cette documentation.","sec":"Les fonctions","grp":"Structurer son code"},{"id":"lambda","t":"La fonction lambda","s":[["Le carré d'un nombre, en une ligne","carre = lambda x: x ** 2"],["Plusieurs paramètres","total = lambda prix, quantite: prix * quantite"],["Avec une condition","lambda x: \"Gros\" if x >= 100 else \"Petit\""]],"trap":"Une lambda ne contient **qu'une expression** : pas de boucle, pas de `if` sur plusieurs lignes. Au-delà, écris un `def`.","why":"`lambda x:` remplace `def nom(x):` et le `return` est implicite. Elle sert surtout à passer une petite fonction à une autre (`sorted`, `max`, `apply` en pandas).","sec":"Écrire court (shorthand)","grp":"Structurer son code"},{"id":"comprehension","t":"La compréhension de liste","s":[["Transformer chaque élément","[i * 3 for i in range(10)]"],["Filtrer : le if à la fin","[i * 3 for i in range(10) if i != 5]"],["Transformer selon le cas : if/else au début","[x ** 2 if x % 2 == 0 else x ** 3 for x in range(6)]"]],"tab":[["Je veux…","Le if se place"],["garder certains éléments (sans else)","après le `for`"],["traiter tous les éléments différemment (avec else)","avant le `for`"]],"tip":"Lis-la de droite à gauche : « pour chaque i dans range(10), je produis i × 3 ».","sec":"Écrire court (shorthand)","grp":"Structurer son code"},{"id":"comprehension-dict","t":"Compréhensions de dictionnaire et de set","s":[["Un dictionnaire à partir de deux listes","carte = {nom: prix for nom, prix in zip(plats, tarifs)}"],["Filtrer un dictionnaire","{nom: prix for nom, prix in carte.items() if prix < 10}"],["Un set","{client.upper() for client in commandes}"]],"sec":"Écrire court (shorthand)","grp":"Structurer son code"},{"id":"map-filter","t":"map, filter, sum : avec une fonction","s":[["Appliquer une fonction à chaque élément","list(map(abs, nombres))"],["Ne garder que certains éléments","list(filter(lambda p: p < 10, tarifs))"],["Une somme filtrée en une ligne","sum(x for x in nombres if x % 2 == 0)"]],"tip":"En Python, on préfère la compréhension : `[abs(x) for x in nombres]` se lit mieux que `list(map(abs, nombres))`. Connais `map` et `filter` pour les reconnaître.","sec":"Écrire court (shorthand)","grp":"Structurer son code"},{"id":"key","t":"Trier ou chercher le maximum selon un critère : key=","s":[["Les plats du moins cher au plus cher","sorted(carte, key=lambda plat: carte[plat])"],["Le plat le plus cher","max(carte, key=carte.get)"],["Le mois aux meilleures ventes","max(ventes, key=lambda m: m[\"sales\"])"]],"trap":"En cas d'égalité, `max()` renvoie le premier rencontré. Vérifie les ex æquo avant d'annoncer un gagnant unique.","why":"`key` reçoit chaque élément et renvoie la valeur sur laquelle comparer. Le même `key=` marche dans `sorted()`, `max()`, `min()` et `.sort()`.","sec":"Écrire court (shorthand)","grp":"Structurer son code"},{"id":"quand-court","t":"Quand ne PAS écrire court","tab":[["Signal","Mieux vaut une boucle"],["la ligne dépasse ~80 caractères","oui"],["plus d'un `for` imbriqué","oui"],["tu as besoin d'un commentaire au milieu","oui"],["tu dois relire la ligne deux fois","oui"]],"why":"Du code lisible par un collègue vaut mieux que du code malin.","sec":"Écrire court (shorthand)","grp":"Structurer son code"},{"id":"importer","t":"Importer : les quatre formes","s":[["Le module entier (la forme par défaut)","import math\nmath.sqrt(16)"],["Une fonction précise","from math import sqrt"],["Avec un alias","import pandas as pd"],["Plusieurs éléments","from math import sqrt, pi"]],"trap":"N'écris jamais `from math import *` : on ne sait plus d'où viennent les noms, et un module peut écraser en silence la fonction d'un autre.","why":"Avec `import math`, on voit toujours d'où vient la fonction (`math.sqrt`). Les alias `pd`, `np`, `plt` sont des conventions que tout le monde respecte.","sec":"Les modules","grp":"Structurer son code"},{"id":"bibliotheque-standard","t":"La bibliothèque standard","s":[["D'abord, importer les modules","import math\nimport random\nimport statistics\nfrom datetime import datetime"],["Racine carrée, arrondi au-dessus, en dessous","math.sqrt(16), math.ceil(4.2), math.floor(4.8)"],["Un entier au hasard entre 1 et 10","random.randint(1, 10)"],["Un élément au hasard","random.choice([\"pomme\", \"banane\", \"cerise\"])"],["Moyenne, médiane, écart-type","statistics.mean(ventes), statistics.median(ventes), statistics.stdev(ventes)"],["La date du jour","datetime.now().strftime(\"%d/%m/%Y\")"]],"tip":"Ces modules sont livrés avec Python : rien à installer, juste `import math`, `import random`… Un `ModuleNotFoundError` veut dire que le module est externe et doit être installé (`!pip install`).","trap":"`random.randint(1, 10)` **peut** renvoyer 10 : contrairement à `range`, il inclut les deux bornes.","sec":"Les modules","grp":"Structurer son code"},{"id":"creer-module","t":"Créer son propre module","s":[["1. Écrire le fichier depuis un notebook","%%writefile data_utils.py\ndef carre(x):\n    \"\"\"Renvoie le carré d'un nombre.\"\"\"\n    return x ** 2"],["2. L'importer","import data_utils"],["3. L'utiliser avec le préfixe","data_utils.carre(7)"]],"trap":"`carre(7)` sans préfixe donne `NameError` : `import data_utils` rend disponible le module, pas ses fonctions. `ModuleNotFoundError` veut dire que le fichier est introuvable.","why":"Un module, c'est un fichier `.py` de fonctions. On range ses outils à un endroit, on les corrige une seule fois, et tous les notebooks en profitent.","sec":"Les modules","grp":"Structurer son code"},{"id":"reload","t":"Recharger un module modifié","s":[["Après chaque modification du fichier","import importlib\nimportlib.reload(data_utils)"]],"tip":"Le réflexe : modification → reload → test, dans cet ordre.","why":"Python garde le module en mémoire au premier import et ne relit plus le fichier. Sans `reload`, tu testes l'ancienne version, parfois sans aucune erreur.","sec":"Les modules","grp":"Structurer son code"},{"id":"name-main","t":"Des tests qui ne s'exécutent pas à l'import","s":[["En bas du module","if __name__ == \"__main__\":\n    print(\"Test carré :\", carre(7))"]],"why":"Ce bloc ne tourne que si on lance le fichier directement (`!python data_utils.py`), pas quand on l'importe. Un module ne doit contenir que des définitions : pas de `print` qui s'exécute tout seul.","sec":"Les modules","grp":"Structurer son code"},{"id":"try-except","t":"Attraper une erreur : try / except","s":[["Essayer, et prévoir le cas d'erreur","try:\n    panier = recette / couverts\nexcept ZeroDivisionError:\n    print(\"Aucun couvert servi.\")"],["Récupérer le message de Python","try:\n    tarif = prix[\"Pizza\"]\nexcept KeyError as e:\n    print(f\"Plat inconnu : {e}\")"]],"tip":"Place le `try` autour de la plus petite portion de code qui peut échouer, **dans** la boucle : sinon la première erreur fait sortir de toute la boucle.","why":"Le `try` ne fait pas disparaître l'erreur : il l'attrape, exécute le bloc `except`, puis le programme continue au lieu de s'arrêter.","sec":"Gérer les erreurs (exceptions)","grp":"Structurer son code"},{"id":"except-nu","t":"Ne jamais écrire except tout seul","s":[["Le piège : une faute de frappe (totl), mais le message parle de division","try:\n    moyenne = totl / couverts\nexcept:\n    print(\"Aucun couvert servi.\")"],["Avec l'erreur nommée, la vraie panne apparaît","try:\n    moyenne = totl / couverts\nexcept ZeroDivisionError:\n    print(\"Aucun couvert servi.\")"]],"trap":"`except:` tout seul attrape **toutes** les erreurs, y compris une faute de frappe dans ton code (`NameError`). Le bug devient invisible, remplacé par un message faux.","sec":"Gérer les erreurs (exceptions)","grp":"Structurer son code"},{"id":"else-finally-raise","t":"else, finally, raise","s":[["Refuser une valeur impossible","if n < 0:\n    raise ValueError(f\"nombre de couverts négatif : {n}\")"]],"tab":[["Mot-clé","Rôle"],["`try`","le code qui peut échouer"],["`except NomErreur`","quoi faire si cette erreur arrive"],["`else`","à faire si **aucune** erreur n'est arrivée"],["`finally`","à faire **dans tous les cas** (fermer un fichier…)"],["`raise`","déclencher soi-même une erreur"]],"trap":"Un `print(\"Erreur\")` à la place de `raise` n'arrête rien : la valeur invalide continue son chemin, et le bug apparaît bien plus loin.","sec":"Gérer les erreurs (exceptions)","grp":"Structurer son code"},{"id":"exception-ou-correction","t":"Gérer l'erreur ou corriger le code ?","tab":[["L'erreur vient…","Exemple","On fait"],["de l'extérieur","saisie, fichier absent, réseau, API","on gère l'exception"],["de ton code","index en dur, faute de frappe","on corrige le code"]],"tip":"Pour un cas prévisible, une vérification suffit : `carte.get(plat)` ou `if couverts != 0:`.","why":"Un `try/except` n'est pas un pansement sur un code faux : il cache le symptôme et laisse le bug en place.","sec":"Gérer les erreurs (exceptions)","grp":"Structurer son code"},{"id":"catalogue-erreurs","t":"Les erreurs les plus courantes","tab":[["Erreur","Quand elle arrive"],["`ZeroDivisionError`","on divise par 0"],["`KeyError`","la clé n'existe pas dans le dictionnaire"],["`IndexError`","la position n'existe pas dans la liste"],["`AttributeError`","la méthode n'existe pas pour ce type (`.upper()` sur un nombre)"],["`ValueError`","bon type, mauvaise valeur (`int(\"douze\")`)"],["`TypeError`","mauvais type (`int([1, 2])`, `\"5\" + 5`)"],["`NameError`","le nom n'existe pas (faute de frappe)"],["`FileNotFoundError`","le fichier n'existe pas"]],"tip":"Le traceback se lit de bas en haut : la dernière ligne donne le type et le message, la flèche `---->` la ligne fautive.","sec":"Gérer les erreurs (exceptions)","grp":"Structurer son code"},{"id":"regles-pep8","t":"Les règles principales","tab":[["Règle","Exemple"],["4 espaces par niveau d'indentation","pas 2, pas de tabulation"],["79 caractères maximum par ligne","couper avec des parenthèses"],["fonctions et variables en snake_case","`prix_ttc`, pas `PrixTTC`"],["une espace autour de `=` et après `,`","`TVA = 1.20`, `f(a, b)`"],["pas d'espace collée aux parenthèses","`print(x)`, pas `print( x )`"],["deux lignes vides avant chaque `def`",""],["pas de `l`, `I`, `O` comme noms","confondus avec 1 et 0"],["une instruction par ligne","pas de `if x: y = 1` sur une ligne"]],"tip":"Si tu rejoins un projet qui a d'autres conventions, écris comme le projet : la cohérence prime.","why":"Le but n'est pas la conformité pour elle-même : c'est que le lecteur n'ait jamais à s'adapter à ton style.","sec":"PEP 8 : écrire un code lisible","grp":"Structurer son code"},{"id":"couper-ligne","t":"Couper une ligne trop longue","s":[["Les parenthèses permettent d'aller à la ligne, l'opérateur en début de ligne","revenu = (salaire_brut\n          + interets\n          - deductions)"],["Une f-string plutôt que des +","print(\n    f\"Ticket pour {nom_client} table {table} réglé par {reglement}\"\n)"]],"sec":"PEP 8 : écrire un code lisible","grp":"Structurer son code"},{"id":"flake8","t":"Vérifier avec flake8","s":[["Installer","!pip install flake8 -q"],["Analyser un fichier","!flake8 caisse.py"]],"tab":[["Code","Veut dire"],["`E…`","règle PEP 8 non respectée"],["`W…`","avertissement de mise en forme"],["`F…`","vrai défaut de code : import inutile, nom non défini"]],"trap":"Une sortie vide ne veut pas dire « code bon » : flake8 ne vérifie ni le nommage (`PrixTTC` passe), ni la logique. Conforme ne veut pas dire juste.","sec":"PEP 8 : écrire un code lisible","grp":"Structurer son code"},{"id":"black","t":"Reformater avec black","s":[["Installer","!pip install black -q"],["Réécrire le fichier proprement","!black caisse.py"]],"tab":[["","flake8 (linter)","black (formateur)"],["Rôle","signale","réécrit"],["Modifie le fichier","non","oui"],["Détecte les imports inutiles","oui","non"]],"tip":"Les deux se complètent : black règle la mise en forme, flake8 attrape ce qui reste. black vise 88 caractères par ligne, flake8 79.","sec":"PEP 8 : écrire un code lisible","grp":"Structurer son code"},{"id":"fonction-methode","t":"Fonction ou méthode ?","s":[["Une fonction reçoit l'objet","len(plat)"],["Une méthode appartient à l'objet","plat.upper()"]],"why":"`len()` est une fonction : elle accepte tout ce qui a une longueur. `.upper()` est une méthode du type `str` : une liste ne l'a pas (`AttributeError`).","sec":"Méthodes et caisse à outils","grp":"Structurer son code"},{"id":"explorer-objet","t":"Explorer un objet inconnu","s":[["Ce que c'est","type(objet)"],["La liste de ses méthodes","[n for n in dir(objet) if not n.startswith(\"_\")]"],["La documentation d'une méthode","help(str.strip)"]],"tip":"Dans Colab, tape `objet.` puis **Tab** pour voir les méthodes, et **Maj + Tab** pour la documentation.","sec":"Méthodes et caisse à outils","grp":"Structurer son code"},{"id":"modifie-ou-renvoie","t":"Modifie sur place ou renvoie un nouvel objet ?","tab":[["Modifie l'objet, renvoie `None`","Renvoie un nouvel objet"],["`liste.append()`, `.insert()`, `.extend()`","`sorted(liste)`, `liste.copy()`"],["`liste.sort()`, `.reverse()`","`texte.upper()`, `texte.strip()`"],["`dict.update()`","`set1 | set2`"],["`set.add()`, `set.discard()`","`liste1 + liste2`"]],"tip":"Aucun de ces oublis ne déclenche d'erreur : un programme qui s'exécute n'est pas forcément un programme juste. Vérifie toujours sur un cas dont tu connais la réponse.","trap":"`ma_liste = ma_liste.sort()` remplace la liste triée par `None`, sans erreur.","why":"Les méthodes de `str` renvoient toujours une copie (une chaîne est immuable). Pour `list`, `dict` et `set`, vérifie au cas par cas avec `help()`.","sec":"Méthodes et caisse à outils","grp":"Structurer son code"},{"id":"boite-outils","t":"Des outils à garder sous la main","s":[["Numéroter à partir de 1","for numero, plat in enumerate(commande, start=1):\n    print(f\"{numero}. {plat}\")"],["Au moins un vrai / tous vrais","any(prix > 20 for prix in carte.values())"],["Compter sans tester si la clé existe","compteur[plat] = compteur.setdefault(plat, 0) + 1"],["Les 3 éléments les plus fréquents","Counter(liste).most_common(3)"]],"tip":"La documentation officielle, en français, fait autorité : docs.python.org/fr/3/library/stdtypes.html.","sec":"Méthodes et caisse à outils","grp":"Structurer son code"},{"id":"json-load","t":"Lire un fichier JSON","s":[["Ouvrir et charger le fichier","import json\n\nwith open(\"restoclic.json\", encoding=\"utf-8\") as fichier:\n    resto = json.load(fichier)"]],"why":"Un JSON, ce sont des dictionnaires et des listes imbriqués, écrits en texte. `with` ferme le fichier automatiquement, même en cas d'erreur. `encoding=\"utf-8\"` garde les accents lisibles sur toutes les machines.","sec":"Lire et écrire du JSON","grp":"Structurer son code"},{"id":"json-loads","t":"Lire une chaîne JSON : loads","s":[["Texte JSON → dictionnaire","data = json.loads(texte)"]],"tab":[["Fonction","Attend"],["`json.load(f)`","un fichier ouvert"],["`json.loads(t)`","une chaîne (le s = string)"]],"trap":"Tant qu'il n'est pas converti, un JSON n'est que du texte : `texte[\"restaurant\"]` donne `TypeError: string indices must be integers`.","sec":"Lire et écrire du JSON","grp":"Structurer son code"},{"id":"json-naviguer","t":"Naviguer dans un JSON","s":[["Explorer la structure d'abord","print(type(data), list(data.keys()))"],["Descendre : dictionnaire → liste → dictionnaire","resto[\"carte\"][2][\"prix\"]"],["Chercher par le nom plutôt que par la position","for plat in resto[\"carte\"]:\n    if plat[\"nom\"] == \"Soupe du jour\":\n        print(plat[\"prix\"])"],["Aperçu lisible du contenu","print(json.dumps(data, indent=2)[:400])"]],"tip":"Avant chaque crochet : un `dict` → une clé, une `list` → une position. On descend un niveau à la fois.","trap":"`resto[\"carte\"][2]` suppose que la soupe est en 3e position : le jour où l'ordre change, le code renvoie le mauvais plat sans erreur.","sec":"Lire et écrire du JSON","grp":"Structurer son code"},{"id":"json-dump","t":"Écrire un fichier JSON","s":[["Exporter un dictionnaire","with open(\"synthese.json\", \"w\", encoding=\"utf-8\") as fichier:\n    json.dump(synthese, fichier, indent=2, ensure_ascii=False)"]],"tab":[["Argument","Sert à"],["`indent=2`","une structure lisible, pas tout sur une ligne"],["`ensure_ascii=False`","écrire `Entrecôte` et non `Entrec\\u00f4te`"],["`\"w\"`","écrire (écrase le fichier existant)"]],"trap":"`\"w\"` écrase le fichier sans prévenir. Relis ensuite le fichier avec `json.load` : c'est la seule preuve qu'il est valide.","sec":"Lire et écrire du JSON","grp":"Structurer son code"},{"id":"json-python","t":"JSON et Python : les différences","tab":[["JSON","Python"],["`true` / `false`","`True` / `False`"],["`null`","`None`"],["objet `{...}`","dictionnaire"],["tableau `[...]`","liste"],["clés entre guillemets **doubles** obligatoires","guillemets simples ou doubles"],["virgule après le dernier élément interdite","tolérée"]],"sec":"Lire et écrire du JSON","grp":"Structurer son code"},{"id":"json-erreurs","t":"Les trois pannes classiques","s":[["Une clé peut manquer : .get avec une valeur par défaut","data.get(\"couverts_par_jour\", 0)"]],"tab":[["Erreur","Quand","Cause"],["`FileNotFoundError`","à l'ouverture","le fichier n'existe pas"],["`json.JSONDecodeError`","à la lecture","le contenu n'est pas du JSON valide (virgule en trop…)"],["`KeyError`","à l'utilisation","la clé demandée n'existe pas"]],"tip":"Le message de `JSONDecodeError` donne la position exacte du problème : `line 4 column 1`.","sec":"Lire et écrire du JSON","grp":"Structurer son code"}]},{"page":"pandas-nettoyage.html","memo":"Pandas : nettoyer et préparer ses données","c":"#0f8a7e","cards":[{"id":"importer","t":"Importer pandas","s":[["Les deux imports en haut de chaque notebook","import pandas as pd\nimport numpy as np"]],"why":"`pd` et `np` sont les surnoms que tout le monde utilise : ton code sera lisible par tous.","sec":"Charger un fichier","grp":"Commencer"},{"id":"creer-df","t":"Créer un tableau à la main","s":[["Les clés deviennent les colonnes, les listes deviennent les valeurs","df_produits = pd.DataFrame({\n    \"produit\": [\"Laptop\", \"Souris\", \"Clavier\"],\n    \"prix_ht\": [850, 25, 60],\n    \"en_stock\": [True, True, False],\n})"]],"tip":"Pratique pour tester un code sur un petit exemple avant de le lancer sur le vrai fichier.","trap":"Toutes les listes doivent avoir la même longueur, sinon pandas renvoie une erreur.","sec":"Charger un fichier","grp":"Commencer"},{"id":"lire","t":"Lire un fichier","s":[["Un fichier CSV","df = pd.read_csv(\"../data/titanic.csv\")"],["Directement depuis une adresse internet (même un fichier .zip)","tweets = pd.read_csv(\"https://github.com/murpi/wilddata/raw/master/quests/tweets.zip\")"],["Un fichier Excel","df = pd.read_excel(\"fichier.xlsx\")"],["Un fichier JSON","df = pd.read_json(\"fichier.json\")"]],"tip":"`../` veut dire « remonte d'un dossier » : le notebook est dans `notebooks/`, les données dans `data/`. Avec une adresse internet, pas besoin de télécharger le fichier avant : pandas le lit directement.","trap":"`read_csv` renvoie déjà un DataFrame : `pd.DataFrame(pd.read_csv(...))` transforme un tableau… en tableau, c'est inutile. Et `pd.read_csv(...)` seul, sans `tweets =` devant, lit le fichier puis le perd aussitôt : il faut toujours ranger le résultat.","sec":"Charger un fichier","grp":"Commencer"},{"id":"lecture-difficile","t":"Le fichier se lit mal","lead":"Tout arrive dans une seule colonne, ou les cases vides ne sont pas reconnues.","s":[["Les colonnes sont séparées par des ; (fréquent en France)","df = pd.read_csv(\"fichier.csv\", sep=\";\")"],["Les colonnes sont séparées par des tabulations (fichiers .tsv, comme IMDb)","df = pd.read_csv(\"fichier.tsv\", sep=\"\\t\")"],["Les cases vides sont écrites \\N au lieu d'être vides (IMDb)","df = pd.read_csv(\"fichier.tsv\", sep=\"\\t\", na_values=\"\\\\N\")"]],"why":"`sep` indique le caractère qui sépare les colonnes. Un CSV utilise normalement la virgule ; s'il utilise autre chose, pandas ne sait pas où couper.","sec":"Charger un fichier","grp":"Commencer"},{"id":"portrait","t":"Tout voir d'un coup : le portrait du tableau","lead":"Une petite fonction qui rassemble les réflexes en un seul tableau, avec une ligne par colonne.","s":[["La fonction (à coller une fois en haut du notebook)","def resume(df):\n    return pd.DataFrame({\n        \"type\": df.dtypes,\n        \"remplies\": df.notna().sum(),\n        \"vides\": df.isna().sum(),\n        \"% vides\": (df.isna().mean() * 100).round(1),\n        \"valeurs différentes\": df.nunique(),\n        \"exemples\": df.apply(lambda col: \", \".join(col.dropna().astype(str).unique()[:3])),\n    })"],["L'utiliser","resume(df)"],["Les colonnes les plus vides en premier","resume(df).sort_values(\"% vides\", ascending=False)"]],"why":"Chaque ligne reprend une méthode du cours (`dtypes`, `isna().sum()`, `nunique()`…), calculée pour toutes les colonnes à la fois. `pd.DataFrame({...})` les range côte à côte, comme un dictionnaire dont chaque clé devient une colonne.","comp":true,"sec":"Premier coup d'œil","grp":"Commencer"},{"id":"check-depart","t":"Les 6 réflexes à l'ouverture d'un fichier","lead":"À lancer chaque fois que tu découvres un nouveau tableau.","s":[["Les 5 premières lignes","df.head()"],["Le nombre de lignes et de colonnes","df.shape"],["Le type de chaque colonne","df.dtypes"],["Résumé : types et nombre de cases remplies","df.info()"],["Statistiques des colonnes de nombres","df.describe()"],["Le nombre de cases vides par colonne","df.isna().sum()"]],"tip":"`df.describe().T` tourne le tableau des statistiques : plus lisible quand il y a beaucoup de colonnes.","why":"En 30 secondes, tu connais la taille, les types, les trous et les ordres de grandeur. On ne nettoie rien avant de savoir ce qu'il y a.","sec":"Premier coup d'œil","grp":"Commencer"},{"id":"display","t":"Afficher de vrais tableaux : display","lead":"Dans un notebook (Colab, Jupyter), à la place de `print`.","s":[["Afficher un tableau mis en forme","display(df.head())"],["Plusieurs tableaux dans la même cellule","display(df.head())\ndisplay(df.describe().T)\ndisplay(df.isna().sum())"]],"trap":"`display` existe dans Colab et Jupyter, sans import. Dans un script `.py` lancé hors notebook, il faut d'abord `from IPython.display import display`.","why":"Une cellule n'affiche que le résultat de sa dernière ligne. `print` affiche les autres, mais en texte brut, mal aligné. `display` affiche chaque tableau comme le dernier : propre, avec ses colonnes alignées.","comp":true,"sec":"Premier coup d'œil","grp":"Commencer"},{"id":"transposer","t":"Tourner un tableau : .T","s":[["Les statistiques, une ligne par colonne","df.describe().T"],["Les 3 premières lignes, en colonnes","df.head(3).T"],["Avec display, dans la même cellule","display(df.describe().T)"]],"tip":"`.T` ne modifie pas `df` : c'est seulement une autre façon de le regarder.","why":"`.T` (comme « transposer ») échange les lignes et les colonnes. Avec beaucoup de colonnes, le tableau déborde à droite ; tourné, il se lit de haut en bas, une colonne du fichier par ligne.","sec":"Premier coup d'œil","grp":"Commencer"},{"id":"taille","t":"La fin du tableau, ses colonnes, sa taille","s":[["Les 5 dernières lignes","df.tail()"],["La liste des noms de colonnes","df.columns"],["Le nombre de lignes seulement","df.shape[0]"],["Le nombre de colonnes seulement","df.shape[1]"],["Une phrase prête à lire","f\"Nous avons {df.shape[0]} lignes et {df.shape[1]} colonnes.\""]],"why":"`df.shape` donne un couple (lignes, colonnes). `[0]` prend le premier nombre, `[1]` le second, comme dans une liste. Dans un f-string, ce qui est entre accolades est remplacé par sa valeur.","sec":"Premier coup d'œil","grp":"Commencer"},{"id":"regarder-colonne","t":"Regarder une colonne","s":[["Combien de fois chaque valeur apparaît, avec une ligne NaN qui compte les cases vides","df[\"Embarked\"].value_counts(dropna=False)"],["La même chose en pourcentages","df[\"Sex\"].value_counts(normalize=True)"],["La liste des valeurs différentes","df[\"Embarked\"].unique()"],["Le nombre de valeurs différentes","df[\"Embarked\"].nunique()"]],"tip":"`unique()` révèle les fautes de frappe : « Paris », « paris » et « Paris » suivi d'un espace comptent comme 3 valeurs.","why":"Par défaut, `value_counts()` ignore les cases vides. Sur `Embarked`, il affiche S 644, C 168, Q 77 : total 889 au lieu de 891, sans rien signaler. Avec `dropna=False`, une ligne `NaN 2` apparaît et le compte est juste.","sec":"Premier coup d'œil","grp":"Commencer"},{"id":"types","t":"Comprendre les types de colonnes","tab":[["Type affiché","Ce que la colonne contient"],["`object`","du texte (noms, villes, catégories)"],["`int64`","des nombres entiers (âge, quantité)"],["`float64`","des nombres à virgule (prix)"],["`bool`","Vrai / Faux (`True` / `False`)"],["`datetime64`","des dates"]],"tip":"Une colonne d'entiers qui a des cases vides s'affiche en `float64` : pandas range les cases vides (`NaN`) parmi les nombres à virgule. Avec pandas 3, le texte peut aussi s'afficher `str` au lieu de `object` (complément).","why":"On ne calcule pas une moyenne sur du texte. Un prix lu comme du texte (`object`) fera planter les calculs ou donnera des résultats absurdes.","sec":"Premier coup d'œil","grp":"Commencer"},{"id":"colonnes","t":"Choisir des colonnes","s":[["Une colonne","df[\"Name\"]"],["Plusieurs colonnes (doubles crochets)","df[[\"Name\", \"Age\", \"Fare\"]]"]],"why":"Une colonne seule s'appelle une Series. Avec une liste de noms (d'où les doubles crochets), tu obtiens un tableau.","sec":"Choisir des colonnes et des lignes","grp":"Commencer"},{"id":"iloc","t":"Par position : iloc","lead":"On compte à partir de 0, comme en Python.","s":[["La première ligne","df.iloc[0]"],["La dernière ligne","df.iloc[-1]"],["La case de la ligne 0, colonne 3","df.iloc[0, 3]"],["Les lignes 0 à 2, les colonnes 0 et 1","df.iloc[0:3, 0:2]"]],"trap":"La fin est exclue : `0:3` donne les lignes 0, 1 et 2.","sec":"Choisir des colonnes et des lignes","grp":"Commencer"},{"id":"loc","t":"Par nom : loc","lead":"Les lignes par leur numéro affiché à gauche (l'index), les colonnes par leur nom.","s":[["Les lignes 0 à 2, de la colonne Name à la colonne Age","df.loc[0:2, \"Name\":\"Age\"]"],["Les plus de 60 ans, deux colonnes seulement","df.loc[df[\"Age\"] > 60, [\"Name\", \"Age\"]]"]],"trap":"Avec `loc`, la fin est incluse : `0:2` donne 0, 1 et 2. Et `df.loc[-1]` plante : le -1 « dernière ligne » ne marche qu'avec `iloc`.","sec":"Choisir des colonnes et des lignes","grp":"Commencer"},{"id":"filtre","t":"Garder les lignes qui respectent une condition","s":[["Les passagers de plus de 60 ans","df[df[\"Age\"] > 60]"]],"tip":"Un âge vide donne Faux : on ne peut pas dire qu'il dépasse 60.","why":"`df[\"Age\"] > 60` donne une colonne de Vrai/Faux, une réponse par ligne. Placée dans `df[...]`, elle ne garde que les lignes Vrai.","sec":"Filtrer des lignes","grp":"Commencer"},{"id":"filtre-plusieurs","t":"Combiner plusieurs conditions","s":[["Les deux conditions vraies (ET)","df[(df[\"Sex\"] == \"female\") & (df[\"Pclass\"] == 1)]"],["Au moins une vraie (OU)","df[(df[\"Age\"] < 10) | (df[\"Age\"] > 60)]"],["Le contraire (NON)","df[~(df[\"Embarked\"] == \"S\")]"],["La valeur fait partie d'une liste","df[df[\"Embarked\"].isin([\"C\", \"Q\"])]"]],"trap":"On écrit `&` `|` `~` (pas `and`, `or`, `not`), et chaque condition entre parenthèses.","sec":"Filtrer des lignes","grp":"Commencer"},{"id":"filtre-autres","t":"D'autres façons d'écrire un filtre","lead":"Même résultat, écritures différentes : choisis celle qui se lit le mieux.","s":[["Ranger la condition dans une variable, plus lisible","condition = (df[\"Age\"] >= 25) & (df[\"Age\"] <= 30)\ndf[condition]"],["Un intervalle, bornes comprises","df[df[\"Age\"].between(25, 30)]"],["Une écriture qui ressemble à du SQL","df.query(\"Embarked == 'S'\")"]],"tip":"Dans `query`, toute la condition est entre guillemets, les noms de colonnes sans guillemets, et le texte à comparer entre apostrophes.","sec":"Filtrer des lignes","grp":"Commencer"},{"id":"filtrer-calculer","t":"Filtrer puis calculer","s":[["L'âge moyen des passagers de 1re classe","df[df[\"Pclass\"] == 1][\"Age\"].mean()"],["Le passager qui a payé le billet le plus cher","df.sort_values(\"Fare\", ascending=False).head(1)"]],"tip":"Le même calcul pour chaque groupe (chaque classe) ? Utilise plutôt `groupby`.","why":"On lit de gauche à droite : on garde les lignes, on prend la colonne, on calcule. Pour « qui a le plus », on trie du plus grand au plus petit et on garde la première ligne.","sec":"Filtrer des lignes","grp":"Commencer"},{"id":"copy","t":"Modifier une sélection sans message d'alerte","s":[["Faire une vraie copie de la sélection","adultes = df[df[\"Age\"] >= 18].copy()"]],"why":"Sans `.copy()`, pandas ne sait pas si tu modifies une copie ou le tableau d'origine. Il affiche alors l'alerte `SettingWithCopyWarning`.","sec":"Filtrer des lignes","grp":"Commencer"},{"id":"doublons-compter","t":"Compter et voir les doublons","s":[["Compter les lignes en double","df.duplicated().sum()"],["Les afficher","df[df.duplicated()]"]],"tip":"Un doublon gonfle les chiffres : la même commande comptée deux fois, c'est de l'argent qui n'existe pas.","why":"`duplicated()` répond Vrai quand la même ligne existe plus haut. La première reste Faux : c'est l'originale. `.sum()` compte les Vrai (Vrai vaut 1).","sec":"Doublons","grp":"Nettoyer"},{"id":"doublons-tous","t":"Voir l'original et ses copies","s":[["Toutes les lignes concernées, original compris","df[df.duplicated(keep=False)]"]],"tip":"Pratique pour les comparer côte à côte avant de supprimer.","comp":true,"sec":"Doublons","grp":"Nettoyer"},{"id":"doublons-supprimer","t":"Supprimer les doublons","s":[["Les lignes identiques sur toutes les colonnes","df = df.drop_duplicates()"],["Même identifiant, même si le reste diffère","df = df.drop_duplicates(subset=[\"PassengerId\"])"],["Garder la dernière copie plutôt que la première","df = df.drop_duplicates(subset=[\"PassengerId\"], keep=\"last\")"]],"trap":"Sans `df =`, rien ne change : la plupart des méthodes (`drop_duplicates`, `fillna`, `drop`, `rename`, `merge`…) fabriquent un nouveau tableau, qui s'affiche puis disparaît. Seules les écritures `df[\"col\"] = …` et `df.loc[…] = …` modifient directement le tableau.","why":"`subset` dit quelles colonnes définissent un doublon. Un numéro de commande ne doit jamais apparaître deux fois ; un même prénom, c'est juste un client qui revient.","sec":"Doublons","grp":"Nettoyer"},{"id":"merge","t":"Relier deux tableaux par une colonne commune (merge)","lead":"Comme un JOIN en SQL : la colonne commune s'appelle la clé.","s":[["La clé a le même nom des deux côtés","df = pd.merge(films, notes, how=\"left\", on=\"tconst\")"],["La clé n'a pas le même nom","df = pd.merge(films, akas, how=\"inner\", left_on=\"tconst\", right_on=\"titleId\")"],["La même chose, écrite à partir du premier tableau","df_merged = df_apprenants.merge(df_scores, on=\"id\", how=\"left\")"],["Relier sur deux colonnes à la fois","df = pd.merge(df_rh, df_paie, how=\"left\", on=[\"Nom\", \"Département\"])"]],"tab":[["","how=","On garde","En SQL"],["@venn:left","`\"left\"`","toutes les lignes du tableau de gauche","LEFT JOIN"],["@venn:right","`\"right\"`","toutes les lignes du tableau de droite","RIGHT JOIN"],["@venn:inner","`\"inner\"`","seulement ce qui existe des deux côtés","INNER JOIN"],["@venn:outer","`\"outer\"`","tout, des deux côtés","FULL OUTER JOIN"]],"trap":"Un `left` laisse des cases vides quand la clé n'existe pas de l'autre côté. Et compte les lignes après un merge : une clé en double de l'autre côté multiplie les lignes.","why":"Pour choisir `how`, une seule question : quel tableau ne doit perdre aucune ligne ? Pour compléter des commandes avec la fiche client, ce sont les commandes : `left`.","sec":"Assembler deux tableaux","grp":"Nettoyer"},{"id":"concat","t":"Coller des tableaux (concat)","s":[["Mettre un tableau sous l'autre (mêmes colonnes)","df = pd.concat([df_jan, df_fev], ignore_index=True)"],["Mettre un tableau à côté de l'autre (mêmes lignes)","df = pd.concat([df_infos, df_contacts], axis=1)"]],"trap":"Côte à côte, les lignes doivent correspondre une à une. Sinon pandas crée des cases vides : utilise plutôt un `merge`.","why":"`ignore_index=True` renumérote les lignes 0, 1, 2… Sans lui, janvier et février gardent chacun leur ligne 0, leur ligne 1…","sec":"Assembler deux tableaux","grp":"Nettoyer"},{"id":"merge-ou-concat","t":"merge ou concat ?","tab":[["Outil","Ce qu'il fait"],["`merge`","relie grâce à une clé et ajoute des colonnes"],["`concat`","colle des tableaux, dessous ou à côté"]],"sec":"Assembler deux tableaux","grp":"Nettoyer"},{"id":"vides-compter","t":"Compter les cases vides","s":[["Le nombre de cases vides par colonne","df.isna().sum()"],["Le pourcentage de cases vides","df.isna().mean() * 100"],["Le total de cases vides dans tout le tableau (0 à la fin du nettoyage)","df.isna().sum().sum()"]],"tip":"On ne remplit rien avant de savoir où sont les trous.","why":"`isna()` met Vrai dans chaque case vide. Vrai vaut 1 et Faux vaut 0 : `.sum()` compte les vides, `.mean()` donne leur proportion. Le premier `.sum()` compte par colonne, le second additionne toutes les colonnes.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"vides-voir","t":"Voir ou garder les lignes vides","s":[["Voir les lignes où Embarked est vide","df[df[\"Embarked\"].isna()]"],["Garder les lignes où Embarked est rempli","df[df[\"Embarked\"].notna()]"]],"sec":"Les cases vides","grp":"Nettoyer"},{"id":"vides-trace","t":"Garder une trace avant de remplir","s":[["Une colonne Vrai/Faux qui se souvient des âges vides","df[\"Age_manquant\"] = df[\"Age\"].isna()"]],"why":"Une fois la case remplie, tu ne sauras plus quelle valeur était vraie. Cette colonne s'en souvient.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"remplir-choisir","t":"Choisir comment remplir","lead":"Une question par colonne : que veut dire ce vide ?","tab":[["Le vide veut dire…","On remplace par","Exemple"],["« rien » (pas de remise)","`0`","une remise, un bonus"],["« on ne sait pas » (texte)","`\"Inconnu\"`","une ville, un port"],["un nombre oublié","la médiane","un âge, un prix"],["une catégorie oubliée","la valeur la plus fréquente","le port d'embarquement"]],"tip":"L'exemple du live code « pourboires » : les tables sans pourboire sont supprimées (`dropna(subset=[\"tip\"])`), car on ne peut pas inventer ce qu'on analyse. Les cases vides de `smoker` deviennent « Inconnu », car la table compte quand même.","why":"Il n'existe pas une bonne méthode pour tout le tableau : on décide colonne par colonne.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"remplir-fixe","t":"Remplir avec une valeur fixe","s":[["Par 0","df[\"Remise\"] = df[\"Remise\"].fillna(0)"],["Par « Inconnu »","df[\"Embarked\"] = df[\"Embarked\"].fillna(\"Inconnu\")"]],"why":"Avec « Inconnu », on n'invente rien : on écrit qu'on ne sait pas, et la ligne reste dans les calculs.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"remplir-mediane","t":"Remplir un nombre : la médiane","s":[["Par la médiane (le choix par défaut)","df[\"Age\"] = df[\"Age\"].fillna(df[\"Age\"].median())"],["Par la moyenne (seulement sans valeurs extrêmes)","df[\"Age\"] = df[\"Age\"].fillna(df[\"Age\"].mean())"]],"why":"La moyenne se laisse tirer par les valeurs extrêmes. Dans le cours, une commande à 3 500 € fait monter la moyenne à 539 € ; la médiane (la valeur du milieu) reste à 92 €.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"remplir-mode","t":"Remplir une catégorie : la valeur la plus fréquente","s":[["Trouver la valeur la plus fréquente","mode = df[\"Embarked\"].mode()[0]"],["Remplir avec","df[\"Embarked\"] = df[\"Embarked\"].fillna(mode)"]],"why":"`mode()` renvoie une liste, car plusieurs valeurs peuvent être à égalité. `[0]` prend la première.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"remplir-groupe","t":"Remplir selon le groupe","s":[["L'âge médian de la classe du passager","df[\"Age\"] = df[\"Age\"].fillna(df.groupby(\"Pclass\")[\"Age\"].transform(\"median\"))"]],"why":"`transform` donne à chaque ligne la médiane de son groupe. Un passager de 1re classe reçoit l'âge médian de la 1re classe : plus réaliste qu'une médiane globale.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"ffill","t":"Recopier la valeur d'avant ou d'après","s":[["Recopier la valeur précédente","df[\"Temperature\"] = df[\"Temperature\"].ffill()"],["Recopier la valeur suivante","df[\"Temperature\"] = df[\"Temperature\"].bfill()"]],"trap":"Seulement quand l'ordre des lignes a un sens, comme des jours qui se suivent. Trie d'abord par date.","sec":"Les cases vides","grp":"Nettoyer"},{"id":"dropna","t":"Supprimer les lignes qui ont des vides","s":[["Si une case est vide, n'importe où","df = df.dropna()"],["Si Embarked est vide","df = df.dropna(subset=[\"Embarked\"])"],["Si Age ou Fare est vide","df = df.dropna(subset=[\"Age\", \"Fare\"])"],["Seulement si Age et Fare sont vides tous les deux","df = df.dropna(subset=[\"Age\", \"Fare\"], how=\"all\")"]],"tip":"Supprimer, c'est perdre des lignes : on préfère remplir, et on ne supprime que l'inutilisable.","trap":"`dropna()` sans `subset` regarde toutes les colonnes. Sur le Titanic, la colonne `Cabin` (77 % vide) ferait disparaître environ 700 passagers !","sec":"Les cases vides","grp":"Nettoyer"},{"id":"outliers-reperer","t":"Repérer une valeur anormale","s":[["Les statistiques d'une colonne","df[\"Fare\"].describe()"]],"why":"Compare `mean` (la moyenne) et `50%` (la médiane). Si la moyenne est bien plus haute, quelques valeurs très grandes la tirent vers le haut. Regarde aussi `max` par rapport à `75%`.","sec":"Valeurs aberrantes (outliers)","grp":"Nettoyer"},{"id":"iqr","t":"Détecter avec la méthode IQR","lead":"La méthode la plus utilisée : on mesure la « boîte » du milieu, et ce qui s'en éloigne trop est signalé.","s":[["Calculer les bornes","Q1 = df[\"Fare\"].quantile(0.25)\nQ3 = df[\"Fare\"].quantile(0.75)\nIQR = Q3 - Q1\nborne_basse = Q1 - 1.5 * IQR\nborne_haute = Q3 + 1.5 * IQR"],["Afficher les lignes signalées","df[(df[\"Fare\"] < borne_basse) | (df[\"Fare\"] > borne_haute)]"]],"trap":"La méthode signale, c'est toi qui décides. Sur le Titanic, beaucoup de billets de 1re classe sont signalés : ce sont de vrais prix, pas des erreurs.","why":"Q1 et Q3 encadrent la moitié centrale des données : c'est la boîte, sa largeur s'appelle l'IQR. Au-delà d'une fois et demie cette largeur, une valeur est jugée trop loin des autres.","sec":"Valeurs aberrantes (outliers)","grp":"Nettoyer"},{"id":"outliers-decider","t":"Décider quoi faire","lead":"Trois options : on en choisit une selon le cas.","s":[["On connaît la bonne valeur : on corrige (exemple du cours, la boutique)","df.loc[df[\"Commande\"] == \"C08\", \"Montant_HT\"] = 350.0"],["On ne la connaît pas : on ramène aux bornes, sans supprimer de ligne","df[\"Fare\"] = df[\"Fare\"].clip(lower=borne_basse, upper=borne_haute)"],["On supprime les lignes hors bornes","df = df[(df[\"Fare\"] >= borne_basse) & (df[\"Fare\"] <= borne_haute)]"]],"trap":"Pour corriger une case, c'est toujours `df.loc[condition, colonne] = valeur`. Vu en live code : `df[(df[\"tip\"] == 50).sum()] = 5` crée une nouvelle colonne au lieu de corriger le pourboire. Et pense à recalculer les colonnes qui en dépendent (le pourcentage de pourboire).","why":"Erreur ou vraie valeur ? On regarde le contexte, et souvent on demande au métier. Une vraie valeur extrême (la directrice, un billet de luxe) se garde.","sec":"Valeurs aberrantes (outliers)","grp":"Nettoyer"},{"id":"boxplot","t":"Voir les outliers en graphique","s":[["La boîte à moustaches","df[\"Fare\"].plot.box()"]],"tip":"Les points isolés au-delà des moustaches sont les valeurs
