un reconstruit sa bulle.","sec":"Pas à pas : cloner un projet et le faire tourner","grp":"GitHub et équipe"},{"id":"gc-travailler","t":"3. Travailler sans toucher à main","s":[["Partir de la dernière version, sur sa propre branche","git switch main\ngit pull\ngit switch -c ma-tache"],["Envoyer sa branche la première fois","git push -u origin ma-tache"]],"tip":"Pour pousser sur le dépôt d'un camarade, il doit t'ajouter : **Settings → Collaborators** (invitation à accepter par e-mail).","sec":"Pas à pas : cloner un projet et le faire tourner","grp":"GitHub et équipe"},{"id":"gc-pieges","t":"Les pièges du clone","tab":[["Situation","Ce qui se passe"],["Un dépôt partagé n'est pas dans l'onglet « Repositories » de mon profil","normal : il ne liste que tes propres dépôts. Les autres sont sur la page d'accueil de GitHub, colonne de gauche. Mets l'URL en favori."],["`git add` ne prépare rien alors que j'ai modifié le fichier","ton terminal est dans un autre dossier (l'autre copie du projet) : chaque dépôt a son propre index → `pwd`"],["Le terminal affiche encore (.venv) dans le nouveau projet","`cd` ne change pas d'environnement : `deactivate`, puis active celui du projet"],["Download ZIP au lieu de clone","pas d'historique, pas de branches, impossible de contribuer"]],"comp":true,"sec":"Pas à pas : cloner un projet et le faire tourner","grp":"GitHub et équipe"},{"id":"workflow","t":"Le déroulé d'une tâche en équipe","s":[["Début de tâche : partir de main","git switch main"],["… à jour","git pull"],["Une branche par tâche","git switch -c ma-tache"],["(travailler, add, commit), puis envoyer la branche","git push -u origin ma-tache"],["Après validation de la PR : revenir sur main","git switch main"],["… la mettre à jour","git pull"],["… et supprimer la branche","git branch -d ma-tache"]],"tip":"Vérifie la parenthèse du terminal : `(main)` ou `(marco_b)`. Travailler sur `main` par erreur, c'est commiter directement dans la version commune.","why":"La règle qui évite 90 % des ennuis à deux : chacun sur sa branche, et `main` ne reçoit que des Pull Requests. Deux personnes qui poussent sur `main` en même temps, c'est le conflit garanti.","sec":"Travailler en équipe","grp":"GitHub et équipe"},{"id":"pull-request","t":"La Pull Request","lead":"Après `git push -u origin ma-branche`, GitHub affiche **Compare & pull request**. Sinon : Pull requests → New → base `main` ← compare ta branche.","tab":[["Étape","Où"],["Titre clair + description (quoi et pourquoi)","la PR"],["Relire le diff ligne à ligne","onglet Files changed"],["Fusionner","Merge pull request"],["Supprimer la branche sur GitHub","Delete branch"],["Rapatrier en local","`git switch main` puis `git pull`"]],"why":"Une PR est une demande d'intégration de ta branche dans `main` : on relit, on commente, puis on fusionne. Même seul, c'est le mode de travail de toutes les équipes : personne ne pousse directement sur `main` en entreprise.","sec":"Travailler en équipe","grp":"GitHub et équipe"},{"id":"pr-etat","t":"Pull Request : ouverte ou fusionnée ?","tab":[["État sur GitHub","Après un nouveau git push"],["Open (vert)","la PR se met à jour toute seule : rien à faire"],["Merged (violet)","créer une nouvelle PR (base main ← compare ma-branche)"]],"tip":"Une PR fusionnée ne se supprime pas : elle fait partie de l'historique. Un fichier envoyé par erreur ? On pousse la version corrigée par-dessus.","trap":"En équipe, évitez `git revert`, `git reset` et `git push --force` sur une version déjà partagée.","sec":"Travailler en équipe","grp":"GitHub et équipe"},{"id":"collaborateurs","t":"Ajouter un collaborateur","lead":"Sur le dépôt : **Settings → Collaborators → Add people**, puis le pseudo. La personne reçoit une invitation par e-mail, à accepter.","tab":[["Niveau","Ce qu'il permet"],["Read","voir et cloner"],["Triage","gérer les issues, sans toucher au code"],["Write","pousser des commits et des branches (suffit pour un binôme)"]],"sec":"Travailler en équipe","grp":"GitHub et équipe"},{"id":"issues","t":"Issues et README","tab":[["Bon titre d'issue","Mauvais"],["Ajouter le filtre par année au tableau de bord","à faire"],["Corriger le calcul du panier moyen (divise par 50 au lieu de 29)","bug"]],"tip":"`Corrige le calcul du panier moyen (#3)` dans un commit le rattache à l'issue n° 3 ; `Closes #3` dans une PR la ferme à la fusion.","why":"Un bon README répond à trois questions, dans l'ordre : qu'est-ce que c'est, qu'est-ce qu'on y trouve, comment joindre l'auteur. Aucun dépôt public sans README : ton profil GitHub est ton portfolio.","sec":"Travailler en équipe","grp":"GitHub et équipe"},{"id":"ge-issue","t":"1. Une issue, une branche","lead":"Sur GitHub, onglet **Issues → New issue** : un titre précis (« Ajouter un script d'analyse des ventes »). Elle reçoit un numéro, par exemple #1.","s":[["Partir de main à jour, créer la branche de la tâche","git switch main\ngit pull\ngit switch -c ajout-analyse-csv"]],"sec":"Pas à pas : une tâche de l'issue à la fusion","grp":"GitHub et équipe"},{"id":"ge-commit","t":"2. Travailler, enregistrer, envoyer la branche","s":[["Préparer, relire, enregistrer","git status\ngit add src/analyse_csv.py\ngit diff --staged\ngit commit -m \"Ajoute un premier script d'analyse CSV\""],["Envoyer la branche sur GitHub","git push -u origin ajout-analyse-csv"]],"sec":"Pas à pas : une tâche de l'issue à la fusion","grp":"GitHub et équipe"},{"id":"ge-pr","t":"3. La Pull Request","tab":[["Étape","Sur GitHub"],["Ouvrir","bandeau **Compare & pull request** (ou Pull requests → New)"],["Choisir","base = `main` ← compare = `ajout-analyse-csv`"],["Décrire","ce que tu as fait et pourquoi, + `Closes #1` pour fermer l'issue à la fusion"],["Relire","onglet **Files changed** (ex. 1 fichier, 4 lignes ajoutées)"],["Fusionner","**Merge pull request** puis **Confirm merge**"],["Nettoyer","**Delete branch**"]],"trap":"Ouvrir une Pull Request ne fusionne rien : le travail reste sur sa branche tant que le merge n'est pas validé.","sec":"Pas à pas : une tâche de l'issue à la fusion","grp":"GitHub et équipe"},{"id":"ge-apres","t":"4. Après la fusion : se remettre à jour et nettoyer","s":[["Revenir sur main et récupérer la fusion faite sur GitHub","git switch main\ngit pull"],["Supprimer la branche sur l'ordinateur, puis sur GitHub","git branch -d ajout-analyse-csv\ngit push origin --delete ajout-analyse-csv"],["Oublier les références des branches supprimées","git fetch --prune"]],"why":"Supprimer la branche ne supprime pas son travail : la PR l'a intégré à `main`. Tu ne supprimes que l'étiquette.","sec":"Pas à pas : une tâche de l'issue à la fusion","grp":"GitHub et équipe"},{"id":"maj-branche","t":"Mettre sa branche à jour avec main","s":[["0. Vérifier sa branche et l'état (add + commit d'abord s'il y a des modifs)","git status"],["1. Être sur SA branche","git switch marco_b"],["2. Ramener le main de GitHub dans sa branche","git pull origin main"]],"tip":"Quand ? Au début de chaque séance, et après chaque PR fusionnée (la tienne ou celle d'un collègue).","trap":"Le piège vécu : `main` était à jour sur GitHub, mais pas ma branche. Un collègue avait modifié `film_propre.csv` (3 105 → 3 508 films), et je travaillais sur l'ancienne version.","why":"`git pull origin main` = « va chercher `main` sur GitHub (`origin`) et intègre-le dans la branche où je suis ».","sec":"Rester à jour avec main","grp":"GitHub et équipe"},{"id":"fichier-change","t":"Savoir si un fichier a changé sur GitHub","s":[["Regarder les nouveautés, sans rien modifier","git fetch origin"],["Comparer MON fichier avec celui de main sur GitHub","git diff --stat origin/main -- data/propre/film_propre.csv"]],"tip":"Rien ne s'affiche : fichiers identiques. Une ligne avec des `+` et des `-` : le fichier est différent, fais un `git pull origin main`.","sec":"Rester à jour avec main","grp":"GitHub et équipe"},{"id":"fichier-github","t":"Récupérer la version GitHub d'un seul fichier","s":[["Récupérer les nouveautés","git fetch"],["Les fichiers qui diffèrent de main sur GitHub","git diff --name-only origin/main"],["Remplacer MON fichier par celui de main sur GitHub","git restore --source=origin/main data/propre/film_propre.csv"]],"trap":"Ta version locale de ce fichier est écrasée, sans retour possible si elle n'était pas commitée.","why":"Pour un seul fichier, pas besoin de tout fusionner : `--source=origin/main` va chercher sa version sur GitHub. Le fichier apparaît ensuite modifié (`M`) : add + commit pour le garder.","comp":true,"sec":"Rester à jour avec main","grp":"GitHub et équipe"},{"id":"supprimer-branche","t":"Supprimer une branche terminée (partout)","s":[["1. Aller sur main et le mettre à jour","git switch main\ngit pull"],["2. Supprimer la branche sur l'ordinateur","git branch -d ma-branche"],["3. Supprimer la branche sur GitHub","git push origin --delete ma-branche"]],"tip":"Après la fusion d'une PR, le bouton « Delete branch » de GitHub fait l'étape 3. On ne peut pas supprimer la branche où l'on se trouve : d'où le `git switch main` d'abord.","why":"Continuer sur la même branche plutôt que la supprimer ? Possible : `git pull origin main` la remet à jour.","sec":"Rester à jour avec main","grp":"GitHub et équipe"},{"id":"messages-git","t":"Ce que Git veut dire","tab":[["Message","Ce que ça veut dire → quoi faire"],["`not a git repository`","tu n'es pas dans le dossier du projet → `cd`"],["`rejected ... fetch first`","GitHub a des commits que tu n'as pas → `git pull` puis `git push`"],["`'origin' does not appear to be a git repository`","le `remote add` a échoué → `git remote -v`"],["`nothing to commit, working tree clean`","tout est déjà enregistré"],["`LF will be replaced by CRLF`","simple information sur les fins de ligne Windows"],["`Your branch is ahead of 'origin/main'`","tu as des commits non envoyés → `git push`"],["`Your branch is behind`","GitHub a des nouveautés → `git pull`"],["`no changes added to commit`","des fichiers modifiés pas encore ajoutés → `git add`"],["`nothing added to commit but untracked files present`","seulement de nouveaux fichiers, jamais ajoutés → `git add`"],["`Please tell me who you are`","nom et e-mail pas configurés → `git config --global`"]],"sec":"Les messages fréquents","grp":"GitHub et équipe"},{"id":"cinq-reflexes","t":"Les cinq réflexes du cours","tab":[["#","Réflexe"],["1","`git status` avant et après chaque commande"],["2","vérifier sa branche avant de commiter"],["3","écrire le `.gitignore` avant le premier `add`"],["4","relire avec `git diff --staged` ce qui va partir"],["5","`git pull` avant de travailler, et avant de pousser"]],"sec":"Les messages fréquents","grp":"GitHub et équipe"}]}];/*/DATA*/
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = (s) => esc(s).split(/(`[^`]+`)/).map((p) => p.startsWith("`") && p.endsWith("`") && p.length > 1 ? "<code>" + p.slice(1, -1) + "</code>" : p.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")).join("");
let fav = {}; try { fav = JSON.parse(localStorage.getItem("memos-favoris") || "{}"); } catch (e) {}
let only = new URLSearchParams(location.search).get("memo") || "";
try { only = only || sessionStorage.getItem("memos-favpdf") || ""; sessionStorage.removeItem("memos-favpdf"); } catch (e) {}
if (!DATA.some((m) => m.page === only)) only = "";
let n = 0, html = "";
DATA.forEach((m) => {
  if (only && m.page !== only) return;
  const cards = m.cards.filter((c) => fav[m.page + "#" + c.id]); if (!cards.length) return;
  n += cards.length;
  html += '<div class="memo" style="--c:' + m.c + '">' + esc(m.memo) + "</div>";
  cards.forEach((c) => {
    html += '<div class="card" style="--c:' + m.c + '"><h2>' + esc(c.t) + (c.comp ? '<span class="comp">Complément</span>' : "") + '</h2><p class="where">' + esc(c.grp) + " › " + esc(c.sec) + "</p>"
      + (c.lead ? '<p class="lead">' + fmt(c.lead) + "</p>" : "")
      + (c.s || []).map(([lab, code]) => (lab ? '<p class="lab">' + fmt(lab) + "</p>" : "") + "<pre>" + esc(code) + "</pre>").join("")
      + (c.tab ? "<table><thead><tr>" + c.tab[0].map((x) => "<th>" + fmt(x) + "</th>").join("") + "</tr></thead><tbody>" + c.tab.slice(1).map((r) => "<tr>" + r.map((x) => "<td>" + fmt(x) + "</td>").join("") + "</tr>").join("") + "</tbody></table>" : "")
      + (c.tip ? '<p class="note tip"><b>Astuce.</b>' + fmt(c.tip) + "</p>" : "")
      + (c.trap ? '<p class="note trap"><b>Piège.</b>' + fmt(c.trap) + "</p>" : "")
      + (c.why ? '<p class="note why"><b>Pourquoi ?</b>' + fmt(c.why) + "</p>" : "")
      + "</div>";
  });
});
const d = new Date(), date = d.toLocaleDateString("fr-FR");
document.getElementById("info").textContent = n ? n + (n > 1 ? " fiches" : " fiche") + " · " + date : date;
document.getElementById("out").innerHTML = n ? html : '<p class="empty">Aucun favori pour l\'instant. Dans un mémo, clique sur l\'étoile d\'une fiche, puis reviens ici.</p>';
const M = DATA.find((m) => m.page === only);
if (M) { document.querySelector(".head h1").textContent = "Mes favoris : " + M.memo.split(" : ")[0]; document.getElementById("only").innerHTML = 'Seulement ce mémo · <a href="favoris.html" id="all">voir tous mes favoris</a>'; }
document.title = (M ? "Mes favoris " + M.memo.split(" : ")[0] : "Mes fiches favorites") + " - " + d.toISOString().slice(0, 10);
document.getElementById("print").disabled = !n;
document.getElementById("why").addEventListener("change", (e) => document.body.classList.toggle("nowhy", !e.target.checked));
document.getElementById("print").addEventListener("click", () => { try { window.print(); } catch (e) {} });
</script>
