signalées par la méthode IQR.","sec":"Valeurs aberrantes (outliers)","grp":"Nettoyer"},{"id":"drop-colonnes","t":"Supprimer des colonnes","s":[["Une colonne","df = df.drop(columns=[\"Cabin\"])"],["Plusieurs colonnes","df = df.drop(columns=[\"Name\", \"Ticket\"])"]],"why":"Une colonne presque vide (comme `Cabin`) gêne plus qu'elle n'aide. Mais c'est définitif : essaie d'abord de la remplir si elle a du sens.","sec":"Supprimer des lignes ou des colonnes","grp":"Transformer"},{"id":"drop-lignes","t":"Supprimer des lignes","s":[["Par leur numéro (affiché à gauche)","df = df.drop(index=[61, 829])"],["Garder seulement les billets payés","df = df[df[\"Fare\"] > 0]"],["Renuméroter 0, 1, 2… après des suppressions","df = df.reset_index(drop=True)"]],"trap":"`drop(index=61)` supprime la ligne qui porte le numéro 61 à gauche, pas forcément la 62e ligne.","sec":"Supprimer des lignes ou des colonnes","grp":"Transformer"},{"id":"map-replace","t":"Remplacer des valeurs","s":[["Tout traduire (le reste devient vide)","df[\"Sex\"] = df[\"Sex\"].map({\"male\": 1, \"female\": 0})"],["Remplacer certaines valeurs (le reste ne bouge pas)","df[\"Sex\"] = df[\"Sex\"].replace({\"male\": \"homme\"})"]],"trap":"Avec `map`, une valeur oubliée dans le dictionnaire devient vide (`NaN`). Avec `replace`, elle reste telle quelle.","sec":"Modifier des valeurs","grp":"Transformer"},{"id":"loc-modifier","t":"Modifier les cases qui respectent une condition","s":[["Les âges négatifs deviennent vides","df.loc[df[\"Age\"] < 0, \"Age\"] = np.nan"]],"why":"`loc[lignes, colonne]` vise exactement les cases à changer : les lignes qui respectent la condition, dans la colonne nommée.","sec":"Modifier des valeurs","grp":"Transformer"},{"id":"np-where","t":"Créer une colonne oui / non","s":[["« oui » si moins de 18 ans, sinon « non »","df[\"Enfant\"] = np.where(df[\"Age\"] < 18, \"oui\", \"non\")"]],"trap":"Un âge vide donne « non », car la condition est fausse. Traite les cases vides avant.","sec":"Modifier des valeurs","grp":"Transformer"},{"id":"defaut-loc","t":"Une colonne avec une valeur par défaut","s":[["Tout le monde reçoit « Passable »","df[\"Mention\"] = \"Passable\""],["Puis « Bien » pour les scores de 80 et plus","df.loc[df[\"Score\"] >= 80, \"Mention\"] = \"Bien\""]],"trap":"Un score vide reste « Passable » : la condition est fausse. Traite les cases vides avant.","why":"Deux étapes faciles à lire : une valeur pour tous, puis on corrige seulement les lignes concernées. Avec plus de deux cas, on ajoute une ligne `loc` par cas.","sec":"Modifier des valeurs","grp":"Transformer"},{"id":"cut","t":"Découper en tranches","s":[["Des tranches d'âge","df[\"Tranche\"] = pd.cut(df[\"Age\"], bins=[0, 12, 18, 60, 100], labels=[\"enfant\", \"ado\", \"adulte\", \"senior\"])"]],"tip":"5 bornes font 4 tranches : il faut un nom de moins que de bornes.","sec":"Modifier des valeurs","grp":"Transformer"},{"id":"colonne-calculee","t":"Créer une colonne calculée","s":[["La taille de la famille à bord (+1 pour le passager lui-même)","df[\"Famille\"] = df[\"SibSp\"] + df[\"Parch\"] + 1"],["Exemple du cours : le montant TTC","df[\"Montant_TTC\"] = df[\"Montant_HT\"] * 1.20"]],"tip":"Le calcul se fait sur toutes les lignes d'un coup, sans boucle. Pour un calcul simple entre colonnes, pas besoin d'`apply`.","sec":"Calculer : colonnes, apply, lambda","grp":"Transformer"},{"id":"apply","t":"Appliquer sa propre fonction (apply)","s":[["La fonction","def tranche_age(age):\n    if age < 18:\n        return \"Enfant\"\n    else:\n        return \"Adulte\""],["L'appliquer à chaque valeur de la colonne","df[\"Statut\"] = df[\"Age\"].apply(tranche_age)"]],"trap":"Le nom de la fonction s'écrit sans parenthèses : `apply(tranche_age)`. Et un âge vide part dans le `else`.","why":"Un `if` sur une colonne entière donne l'erreur `The truth value of a Series is ambiguous` : il ne sait tester qu'une valeur. `apply` envoie les valeurs dans la fonction une par une.","sec":"Calculer : colonnes, apply, lambda","grp":"Transformer"},{"id":"lambda","t":"La même chose en une ligne (lambda)","s":[["Enfant / Adulte en une ligne","df[\"Statut\"] = df[\"Age\"].apply(lambda x: \"Enfant\" if x < 18 else \"Adulte\")"],["Arrondir chaque prix","df[\"Fare\"].apply(lambda x: round(x, 2))"]],"trap":"Vu en live code : `df[\"Montant_HT\"].apply(lambda x: ...)` sans `df[\"Panier\"] =` devant. Le résultat s'affiche puis disparaît : il faut toujours ranger le résultat.","why":"`lambda x:` remplace `def nom(x):`. `x` reçoit chaque valeur de la colonne, l'une après l'autre.","sec":"Calculer : colonnes, apply, lambda","grp":"Transformer"},{"id":"apply-axis1","t":"Utiliser plusieurs colonnes à la fois","s":[["Signaler les enfants de 3e classe","df[\"Alerte\"] = df.apply(lambda ligne: \"Enfant 3e\" if ligne[\"Pclass\"] == 3 and ligne[\"Age\"] < 18 else \"OK\", axis=1)"]],"trap":"Sans `axis=1`, pandas envoie des colonnes entières : erreur.","why":"Avec `axis=1`, la fonction reçoit une ligne entière : on lit chaque colonne avec `ligne[\"...\"]`.","sec":"Calculer : colonnes, apply, lambda","grp":"Transformer"},{"id":"rename","t":"Renommer des colonnes","s":[["Renommer certaines colonnes","df = df.rename(columns={\"Sex\": \"Sexe\", \"Pclass\": \"Classe\"})"],["Tous les noms en minuscules","df.columns = df.columns.str.lower()"]],"sec":"Renommer et changer les types","grp":"Transformer"},{"id":"astype","t":"Changer le type d'une colonne","s":[["En catégorie","df[\"Pclass\"] = df[\"Pclass\"].astype(\"category\")"],["En nombre entier qui accepte les cases vides","df[\"Age\"] = df[\"Age\"].astype(\"Int64\")"],["Du texte vers un nombre","df[\"prix\"] = pd.to_numeric(df[\"prix\"], errors=\"coerce\")"],["Du texte vers une date (jour/mois/année)","df[\"date\"] = pd.to_datetime(df[\"date\"], format=\"%d/%m/%Y\", errors=\"coerce\")"]],"trap":"`astype(int)` plante s'il reste des cases vides. Utilise `\"Int64\"` (avec un I majuscule) ou remplis d'abord.","why":"`errors=\"coerce\"` : ce qui ne peut pas être converti devient une case vide au lieu de faire planter le code. Compte ensuite les cases vides créées.","sec":"Renommer et changer les types","grp":"Transformer"},{"id":"to-datetime","t":"Transformer une colonne de texte en vraies dates","s":[["Convertir la colonne","df[\"date_event\"] = pd.to_datetime(df[\"date_event\"])"],["En précisant le format (jour/mois/année)","df[\"date_event\"] = pd.to_datetime(df[\"date_event\"], format=\"%d/%m/%Y\")"],["Vérifier que le type est devenu datetime64","df.dtypes"]],"why":"Pour Python, « 2024-06-15 » n'est que du texte. Tant qu'elle n'est pas convertie, une date ne se trie pas correctement et on ne peut ni en extraire le mois ni calculer un délai.","sec":"Travailler avec des dates","grp":"Transformer"},{"id":"dates-melangees","t":"Des dates écrites dans plusieurs formats","lead":"Une même colonne mélange « 2024-06-15 » et « 15/06/2024 ». `pd.to_datetime` seul plante, avec un message d'erreur qui propose ce raccourci.","s":[["Laisser pandas deviner le format ligne par ligne, jour en premier","df[\"date\"] = pd.to_datetime(df[\"date\"], format=\"mixed\", dayfirst=True)"],["Vérifier ensuite quelques dates converties","df[[\"date\"]].head(10)"]],"trap":"Testé : avec `dayfirst=True`, « 2024-01-03 » est lu comme le 1er mars au lieu du 3 janvier. Et sans `dayfirst`, « 05/06/2024 » devient le 6 mai. Aucun message d'erreur : les dates sont fausses en silence. Vérifie toujours le résultat, ou utilise la méthode sûre juste en dessous.","why":"Sans `format=\"mixed\"`, pandas déduit le format de la première ligne et refuse toutes celles qui ne le suivent pas (`ValueError: time data ... doesn't match format`). `dayfirst=True` lui dit qu'en cas de doute, le jour vient en premier, à la française.","sec":"Travailler avec des dates","grp":"Transformer"},{"id":"dates-melangees-sur","t":"La méthode sûre : un format à la fois","s":[["Les dates écrites année-mois-jour (les autres deviennent vides)","d1 = pd.to_datetime(df[\"date\"], format=\"%Y-%m-%d\", errors=\"coerce\")"],["Les dates écrites jour/mois/année","d2 = pd.to_datetime(df[\"date\"], format=\"%d/%m/%Y\", errors=\"coerce\")"],["Assembler : les trous de d1 sont bouchés par d2","df[\"date\"] = d1.fillna(d2)"],["Vérifier qu'il ne reste aucune date non lue","df[\"date\"].isna().sum()"]],"tip":"S'il reste des cases vides à la fin, un troisième format traîne (par exemple « 3 janvier 2024 ») : ajoute un `d3`, puis `d1.fillna(d2).fillna(d3)`.","why":"Chaque date est lue avec son format exact : pandas ne devine rien. `errors=\"coerce\"` met une case vide quand la date n'a pas le bon format, et `fillna` la remplace par la lecture avec l'autre format.","comp":true,"sec":"Travailler avec des dates","grp":"Transformer"},{"id":"dt","t":"Extraire le mois, l'année, le jour","s":[["Le mois (1 à 12)","df[\"mois\"] = df[\"date_event\"].dt.month"],["L'année","df[\"annee\"] = df[\"date_event\"].dt.year"],["Le jour du mois","df[\"jour\"] = df[\"date_event\"].dt.day"],["Le nom du jour (en anglais : Monday…)","df[\"nom_du_jour\"] = df[\"date_event\"].dt.day_name()"],["Garder seulement les événements de juin","df[df[\"date_event\"].dt.month == 6]"],["Exemple du live code : le total d'heures par jour","df_sessions.groupby(\"Jour\")[\"Duree_h\"].sum().sort_values(ascending=False)"]],"why":"`.dt` donne accès aux morceaux d'une date, comme `.str` pour le texte. Une fois le mois ou le jour extrait, on peut filtrer ou grouper dessus.","sec":"Travailler avec des dates","grp":"Transformer"},{"id":"strptime","t":"Une date seule : strptime et strftime","lead":"En Python pur, sans pandas, avec le module datetime.","s":[["Importer","from datetime import datetime, timedelta"],["Texte → date : strptime","date1 = datetime.strptime(\"15/06/2024\", \"%d/%m/%Y\")"],["Date → texte mis en forme : strftime","date1.strftime(\"%d/%m/%Y\")"],["Avec l'heure","event = datetime.strptime(\"2024-06-15 21:30\", \"%Y-%m-%d %H:%M\")"]],"tab":[["Code","Signifie","Exemple"],["`%Y`","année (4 chiffres)","2024"],["`%y`","année (2 chiffres)","24"],["`%m`","mois (avec zéro)","06"],["`%d`","jour (avec zéro)","15"],["`%H`","heure (24 h)","21"],["`%M`","minutes","30"],["`%S`","secondes","08"],["`%A`","nom du jour (anglais)","Saturday"],["`%B`","nom du mois (anglais)","June"]],"tip":"Pour s'en souvenir : strP = Parse (lire le texte → date), strF = Format (date → texte).","trap":"Le format doit correspondre à la chaîne caractère par caractère, séparateurs compris (tiret, slash, espace, deux-points). Sinon : `ValueError`.","sec":"Travailler avec des dates","grp":"Transformer"},{"id":"timedelta","t":"Calculer avec des dates : timedelta","s":[["30 jours avant le concert","repetition = concert - timedelta(days=30)"],["3 semaines après le concert","demontage = concert + timedelta(weeks=3)"],["La date et l'heure actuelles","datetime.now()"],["Il y a 7 jours","datetime.now() - timedelta(days=7)"]],"tip":"Durées possibles : `days`, `weeks`, `hours`, `minutes`, `seconds`.","why":"`timedelta` représente une durée. Ajoutée ou retirée à une date, elle donne une nouvelle date.","sec":"Travailler avec des dates","grp":"Transformer"},{"id":"date-ambigue","t":"Un format de date ambigu : apply + strptime","s":[["Imposer exactement le format jour/mois/année","df[\"date_event\"] = df[\"date_event\"].apply(lambda x: datetime.strptime(x, \"%d/%m/%Y\"))"]],"tip":"Dans la plupart des cas, `pd.to_datetime` suffit et va plus vite. On garde `apply + strptime` pour les formats vraiment ambigus ou non reconnus.","why":"« 05/06/2024 » : 5 juin ou 6 mai ? `pd.to_datetime` peut hésiter. Avec `strptime`, c'est toi qui dis où est le jour et où est le mois.","sec":"Travailler avec des dates","grp":"Transformer"},{"id":"str-base","t":"Espaces, majuscules, caractères à remplacer","s":[["Enlever les espaces au début et à la fin","df_produits[\"Nom\"] = df_produits[\"Nom\"].str.strip()"],["Tout en minuscules","df_produits[\"Nom\"] = df_produits[\"Nom\"].str.lower()"],["Tout en majuscules","df_produits[\"Nom\"] = df_produits[\"Nom\"].str.upper()"],["Une majuscule au début de chaque mot","df_produits[\"Nom\"] = df_produits[\"Nom\"].str.title()"],["Remplacer un caractère, dans une nouvelle colonne","df_produits[\"Categories_affichage\"] = df_produits[\"Categories\"].str.replace(\",\", \" / \")"]],"tip":"`.str.strip()` remplace `apply(lambda x: x.strip())` : plus lisible et plus rapide. Il existe aussi `.str.lstrip()` (à gauche seulement) et `.str.rstrip()` (à droite).","why":"`.str` applique la méthode de texte à toute la colonne d'un coup. Sans lui, `df[\"Nom\"].upper()` donne une `AttributeError` : `upper` marche sur un texte, pas sur une colonne.","sec":"Nettoyer du texte","grp":"Transformer"},{"id":"astype-str","t":"Un nombre à mettre en forme : astype(str)","s":[["Le prix à la française : 3.0 devient « 3,0 € »","df_produits[\"Prix_affichage\"] = df_produits[\"Prix_HT\"].astype(str).str.replace(\".\", \",\") + \" €\""]],"trap":"`.str` sur une colonne de nombres donne l'erreur `Can only use .str accessor with string values`. Et la colonne de départ reste un nombre : `astype` fabrique une nouvelle colonne.","why":"`.str` ne marche que sur du texte. `astype(str)` transforme d'abord les nombres en texte ; `+ \" €\"` colle ensuite le symbole, comme quand on additionne deux textes en Python.","sec":"Nettoyer du texte","grp":"Transformer"},{"id":"str-contains","t":"Garder les lignes qui contiennent un mot","s":[["Les produits de la catégorie « scolaire »","df_produits[df_produits[\"Categories\"].str.contains(\"scolaire\")]"],["Sans tenir compte des majuscules","df_produits[df_produits[\"Nom\"].str.contains(\"cahier\", case=False)]"],["Exemple Titanic : les noms qui contiennent « Mrs »","df[df[\"Name\"].str.contains(\"Mrs\", case=False, na=False)]"]],"tip":"`na=False` compte les cases vides comme « pas trouvé » au lieu de renvoyer une case vide qui ferait planter le filtre.","sec":"Nettoyer du texte","grp":"Transformer"},{"id":"str-split","t":"Plusieurs valeurs dans une case : split + explode","lead":"Le cas des catégories, des genres de films, des tags : « papeterie,scolaire » dans une seule case.","s":[["1. Découper chaque case en liste","df_produits[\"Categories\"] = df_produits[\"Categories\"].str.split(\",\")"],["2. Une ligne par catégorie","df_long = df_produits.explode(\"Categories\", ignore_index=True)"],["3. Compter chaque catégorie","df_long[\"Categories\"].value_counts()"],["Ou faire un calcul par catégorie","df_long.groupby(\"Categories\")[\"Stock\"].sum()"],["Exemple Titanic : le nom de famille (avant la virgule)","df[\"Nom\"] = df[\"Name\"].str.split(\",\").str[0]"]],"tip":"`ignore_index=True` renumérote les lignes 0, 1, 2… après l'explode. `.str[0]` prend le premier morceau de la liste.","why":"Après `split`, chaque case contient une liste. `explode` déroule les listes : un produit à 3 catégories devient 3 lignes, et les autres colonnes sont recopiées. Chaque ligne = un produit × une catégorie : on peut enfin compter ou grouper.","sec":"Nettoyer du texte","grp":"Transformer"},{"id":"groupby","t":"Un calcul par groupe (groupby)","s":[["Le taux de survie par classe","df.groupby(\"Pclass\")[\"Survived\"].mean()"],["Par classe et par sexe","df.groupby([\"Pclass\", \"Sex\"])[\"Survived\"].mean()"],["En tableau normal, pour le réutiliser","df.groupby(\"Pclass\")[\"Survived\"].mean().reset_index()"]],"why":"Après un `groupby`, les groupes passent à gauche, à la place des numéros de ligne. `reset_index()` les remet en colonnes normales : indispensable pour filtrer ou relier le résultat ensuite.","sec":"Grouper et résumer","grp":"Analyser et finir"},{"id":"agg","t":"Plusieurs calculs d'un coup (agg)","s":[["Plusieurs calculs sur une colonne","df.groupby(\"Pclass\")[\"Fare\"].agg([\"mean\", \"min\", \"max\", \"count\"])"],["Un calcul différent par colonne","df.groupby(\"Sex\").agg({\"Survived\": \"mean\", \"Age\": \"median\", \"Fare\": \"max\"})"]],"tip":"`count` ne compte que les cases remplies : un résultat plus petit que prévu révèle des vides.","sec":"Grouper et résumer","grp":"Analyser et finir"},{"id":"pivot","t":"Croiser deux colonnes (pivot_table)","lead":"Comme un tableau croisé dynamique dans Excel.","s":[["Le taux de survie par classe (lignes) et par sexe (colonnes)","df.pivot_table(index=\"Pclass\", columns=\"Sex\", values=\"Survived\", aggfunc=\"mean\")"]],"tab":[["Paramètre","Devient"],["`index`","les lignes"],["`columns`","les colonnes"],["`values`","la colonne à calculer"],["`aggfunc`","le calcul : `\"sum\"`, `\"mean\"`, `\"count\"`"]],"sec":"Grouper et résumer","grp":"Analyser et finir"},{"id":"trier","t":"Trier","s":[["Du plus petit au plus grand","df.sort_values(\"Fare\")"],["Les 5 plus grands","df.sort_values(\"Fare\", ascending=False).head(5)"]],"sec":"Grouper et résumer","grp":"Analyser et finir"},{"id":"comparer-stats","t":"Moyenne, effectif et dispersion par groupe","s":[["Pour chaque promo","df_examen.groupby(\"Promo\")[\"Score\"].agg([\"mean\", \"count\", \"std\"])"]],"why":"`std` (l'écart-type) mesure la dispersion : plus il est grand, plus les notes s'éloignent de la moyenne. Deux promos peuvent avoir des moyennes proches mais des dispersions très différentes.","sec":"Comparer des groupes","grp":"Analyser et finir"},{"id":"boxplot-groupes","t":"Voir les groupes côte à côte","s":[["Une boîte à moustaches par promo","df_examen.boxplot(column=\"Score\", by=\"Promo\")"]],"tip":"D'un coup d'œil : la médiane (le trait dans la boîte) et la dispersion (la taille de la boîte) de chaque groupe.","sec":"Comparer des groupes","grp":"Analyser et finir"},{"id":"pvalue","t":"L'écart est-il réel ? Le test de Student","lead":"Avant d'écrire « les Premium dépensent plus que les Standard », on vérifie que l'écart ne vient pas du hasard.","s":[["Importer le test (SciPy, déjà installé dans Colab)","from scipy.stats import ttest_ind"],["Séparer les deux groupes","premium = commandes[commandes[\"abonnement\"] == \"Premium\"][\"montant\"]\nstandard = commandes[commandes[\"abonnement\"] == \"Standard\"][\"montant\"]"],["Lancer le test et afficher la p-value","resultat = ttest_ind(premium, standard)\nprint(resultat.pvalue)"]],"tab":[["p-value","Ce que ça veut dire","Ce qu'on écrit"],["inférieure à 0,05","l'écart est trop rare pour venir du hasard","l'écart est statistiquement significatif"],["0,05 ou plus","un écart pareil peut venir du hasard","l'écart n'est pas significatif : on ne peut pas conclure"]],"trap":"Une p-value au-dessus de 0,05 ne prouve pas que les groupes sont identiques : les données ne suffisent pas à montrer une différence. Et la bibliothèque s'appelle `scipy` : `pip install spicy` installe un autre paquet.","why":"La p-value, c'est la probabilité d'obtenir un écart aussi grand par simple hasard, si les deux groupes étaient en réalité identiques (H0). Comme une pièce : 6 piles sur 10, c'est banal ; 10 sur 10, c'est trop rare pour être le hasard. On cherche à mettre H0 en défaut, on ne « prouve » jamais H1.","sec":"Comparer des groupes","grp":"Analyser et finir"},{"id":"pvalue-lire","t":"Lire une p-value en phrase","tab":[["p-value","Se lit","On en pense"],["0,70","7 fois sur 10, le hasard seul fait un écart aussi grand","le hasard suffit à l'expliquer"],["0,05","1 fois sur 20","c'est la limite qu'on s'est fixée"],["0,01","1 fois sur 100","rare : on ne croit plus au hasard"],["0,0000001","1 fois sur 10 millions","le hasard n'y est pour rien"]],"tip":"`1.0073e-07` est en notation scientifique : `e-07` veut dire « décale la virgule de 7 rangs vers la gauche », soit environ 0,0000001. Réflexe : une p-value affichée avec `e-` est forcément très en dessous de 0,05.","trap":"C'est le nombre après `e-` qui compte : `9.9e-08` est plus petit que `1.2e-07` (8 rangs contre 7).","sec":"Comparer des groupes","grp":"Analyser et finir"},{"id":"pvalue-conclure","t":"Écrire la conclusion","lead":"Trois morceaux : l'écart, le test, puis ce qu'on a le droit d'affirmer.","tab":[["Cas","Modèle de phrase"],["p-value < 0,05","Les Premium dépensent en moyenne 95 € contre 72 € pour les Standard (23 € d'écart). Un test de Student donne une p-value inférieure à 0,05 : l'écart ne s'explique pas par le hasard. Je peux affirmer que les Premium dépensent plus."],["p-value ≥ 0,05","Une commande vaut en moyenne 72 € en semaine contre 73 € le week-end. Un test de Student donne une p-value de 0,56 : l'écart peut venir du hasard. Je ne peux pas affirmer qu'on dépense plus le week-end."]],"trap":"On ne compare que des groupes comparables. Si les Premium achètent surtout de l'électronique et les Standard des vêtements, l'écart vient peut-être de ce qu'ils achètent, pas de leur abonnement.","why":"Les deux conclusions sont des résultats. Savoir écrire « je ne peux pas l'affirmer » évite qu'une décision soit prise sur un écart qui n'existe pas.","sec":"Comparer des groupes","grp":"Analyser et finir"},{"id":"get-dummies","t":"Transformer du texte en colonnes 0 / 1","s":[["Choisir les colonnes utiles","X = df[[\"Pclass\", \"Sex\", \"Age\", \"Embarked\"]]"],["Transformer le texte en 0 / 1","X = pd.get_dummies(X, columns=[\"Sex\", \"Embarked\"], drop_first=True, dtype=int)"]],"tab":[["Paramètre","Rôle"],["`columns=`","les colonnes de texte à transformer"],["`drop_first=True`","retire une colonne inutile (ni C ni Q, c'est forcément S)"],["`dtype=int`","des 1 / 0 au lieu de True / False"]],"trap":"Sur tout le tableau, il crée une colonne par nom, par billet… Choisis d'abord tes colonnes.","why":"Un modèle ne lit que des nombres. Remplacer C, Q, S par 1, 2, 3 inventerait un ordre qui n'existe pas : on crée une colonne 0/1 par valeur.","sec":"Préparer pour un modèle","grp":"Analyser et finir"},{"id":"to-csv","t":"Enregistrer le tableau propre","s":[["Écrire le fichier","df.to_csv(\"../data/titanic_propre.csv\", index=False)"]],"why":"`index=False` évite d'écrire les numéros de ligne. Sans ça, ils reviennent en colonne `Unnamed: 0` quand tu relis le fichier.","sec":"Sauvegarder","grp":"Analyser et finir"},{"id":"bons-reflexes","t":"Ce qui évite les erreurs","tab":[["Réflexe","Comment"],["Ranger le résultat","`df = df.methode(...)`, sinon il s'affiche puis disparaît"],["Regarder avant de supprimer","afficher les lignes concernées, puis décider"],["Vérifier après chaque étape","`df.shape`, `df.isna().sum()`, `df.head()`"],["Notebook bizarre ?","Redémarrer, puis Exécuter tout"],["Avant un modèle","plus aucune case vide, que des nombres"],["Justifier ses choix","chaque suppression ou remplissage s'explique en une phrase"]],"why":"Même code, chiffres faux : dans le cours, sans nettoyage, l'Électronique affiche 3 820 € au lieu de 670 €. C'est le nettoyage qui rend les résultats vrais.","sec":"Bons réflexes","grp":"Analyser et finir"},{"id":"entretien","t":"Pandas, pour quoi faire ?","lead":"La réponse d'entretien du cours.","tip":"« J'utilise pandas pour explorer, nettoyer et analyser des données, et préparer des jeux de données pour des modèles. Pour de très gros volumes, je passerais sur SQL. »","sec":"Bons réflexes","grp":"Analyser et finir"}]},{"page":"git.html","memo":"Terminal, VS Code, Git et GitHub","c":"#d4570f","cards":[{"id":"ouvrir-terminal","t":"Le bon terminal : Git Bash","s":[["Vérifier que Git est installé","git --version"]],"tab":[["","Sous Windows"],["L'application","Git Bash (menu Démarrer, ou dans VS Code)"],["Le shell","bash"],["L'invite","contient `MINGW64` et se termine par `$`"]],"tip":"Après toute installation, ferme et rouvre le terminal : il ne voit pas ce qui a été installé depuis son ouverture.","trap":"Sous Windows, si ton invite affiche `PS C:\\Users\\…`, tu es dans PowerShell : change de terminal avec le petit v à côté du + du panneau Terminal.","why":"Git Bash comprend les commandes Unix (`ls`, `pwd`, `rm`…) utilisées dans tout le cours et dans la plupart des tutoriels. PowerShell et l'invite de commandes ne parlent pas la même langue.","sec":"Ouvrir son terminal","grp":"Le terminal"},{"id":"installer-git","t":"Installer Git sous Windows : les options qui comptent","lead":"Sur gitforwindows.org → Download, puis lance l'installateur. La plupart des écrans : Next. Ceux-ci méritent un choix :","s":[["Vérifier à la fin","git --version"]],"tab":[["Écran","Ce qu'on coche"],["Composants","Git Bash Here (Git Bash dans le clic droit de l'explorateur)"],["Éditeur","**Use Visual Studio Code as Git's default editor** (pas Vim)"],["Branche par défaut","Override… et garder `main`"],["Accès à Git","Git from the command line and also from 3rd-party software"],["Fins de ligne","Checkout Windows-style, commit Unix-style line endings"],["Terminal","Use MinTTY"],["git pull","Fast-forward or merge"],["Identifiants","Git Credential Manager (ne pas retaper son mot de passe)"]],"tip":"Dans Git Bash, Ctrl + V ne colle pas toujours : utilise **Shift + Insert**.","why":"Avec VS Code comme éditeur, un `git commit` sans `-m` ouvre une fenêtre que tu sais utiliser, au lieu de Vim.","sec":"Ouvrir son terminal","grp":"Le terminal"},{"id":"lire-invite","t":"Lire son invite de commande","lead":"Exemple : `Larbi@LAPTOP-EE5HL5VQ MINGW64 ~ $`","tab":[["Morceau","Ce qu'il dit"],["`Larbi@LAPTOP-EE5HL5VQ`","qui tu es, sur quelle machine"],["`MINGW64`","le shell : c'est la signature de Git Bash"],["`~`","où tu es : `~` désigne ton dossier personnel"],["`$`","la machine attend : à toi de taper"]],"tip":"Ton invite ne ressemblera jamais exactement à celle du voisin : lis ce qui suit le `$`, pas ce qui le précède.","sec":"Ouvrir son terminal","grp":"Le terminal"},{"id":"anatomie","t":"Lire une commande : programme, option, argument","s":[["Le programme `ls`, l'option `-l`, l'argument `/home`","ls -l /home"],["L'aide rapide d'une commande","ls --help"]],"tip":"`man ls` (le manuel complet) n'existe pas sous Git Bash : utilise `--help`.","why":"Une commande commence toujours par le nom d'un programme. Les options commencent par un tiret (`-l`, `--help`) et changent son comportement ; l'argument dit sur quoi agir, souvent un fichier ou un dossier.","sec":"Ouvrir son terminal","grp":"Le terminal"},{"id":"pwd-ls","t":"Où suis-je ? Qu'y a-t-il ici ?","s":[["Le dossier où je suis (chemin complet)","pwd"],["Ce que contient ce dossier","ls"],["Avec les fichiers cachés (.gitignore, .venv)","ls -a"],["Une ligne par élément, avec taille et date","ls -l"]],"tip":"Dans le doute : `pwd` pour savoir où tu es, `ls` pour voir ce qu'il y a autour.","why":"`pwd` (print working directory) et `ls` (list) ne modifient jamais rien : aucune raison de s'en priver. Ce sont les deux commandes qu'on tape le plus.","sec":"Se repérer et se déplacer","grp":"Le terminal"},{"id":"cd","t":"Se déplacer : cd","s":[["Entrer dans un dossier (il doit être visible avec ls)","cd Documents"],["Remonter d'un dossier","cd .."],["Revenir à son dossier personnel","cd ~"],["Un nom avec une espace : entre guillemets","cd \"Mon Dossier\""]],"tip":"Touche **Tab** : tape le début d'un nom, le terminal complète (plus de fautes de frappe). Flèche **↑** : rappelle la commande précédente. Sur clavier AZERTY, `~` = AltGr + 2, puis une espace.","trap":"« Is a directory » : tu as tapé un chemin sans `cd` devant, le terminal a essayé de l'exécuter.","why":"`cd` ne cherche pas partout : il cherche dans le dossier où tu te trouves. La même commande peut donc marcher, échouer, puis remarcher, selon l'endroit où tu es.","sec":"Se repérer et se déplacer","grp":"Le terminal"},{"id":"chemins","t":"Chemin absolu, chemin relatif","s":[["Absolu : part de la racine, marche de n'importe où","cd ~/Documents/collecte/data"],["Relatif : part du dossier où tu es","cd collecte/data"]],"tab":[["Raccourci","Désigne"],["`.`","le dossier courant (`./script.sh` = le script qui est ici)"],["`..`","le dossier parent"],["`~`","ton dossier personnel"],["`/c/`","le disque C: (sous Git Bash, `C:\\Users` s'écrit `/c/Users`)"]],"why":"C'est la notion qui explique la moitié des erreurs du terminal. Le relatif est plus court, c'est celui que tu tapes le plus ; l'absolu est plus sûr, c'est celui qu'on écrit dans un script, qui peut être lancé de n'importe où.","sec":"Se repérer et se déplacer","grp":"Le terminal"},{"id":"erreurs-terminal","t":"Deux erreurs à ne pas confondre","tab":[["Message","Le problème vient de…","Exemple"],["`command not found`","la commande elle-même (faute de frappe, outil pas installé)","`ls-l Documents` (espace oubliée)"],["`No such file or directory`","son argument : le fichier ou dossier n'est pas là","`cd Document` (s oublié)"]],"tip":"Le réflexe est toujours le même : `ls` avant `cd`. Le dossier n'est probablement pas là où tu le crois.","sec":"Se repérer et se déplacer","grp":"Le terminal"},{"id":"raccourcis-terminal","t":"Quatre gestes qui font gagner du temps","s":[["Revenir au dossier précédent","cd -"],["Ouvrir le dossier actuel dans l'explorateur Windows","explorer ."],["Les commandes déjà tapées","history"]],"tab":[["Geste","Ce qu'il fait"],["Ctrl + C","arrête une commande qui tourne, ou qui ne rend pas la main"],["`cd -`","revient au dossier où tu étais juste avant"],["`history`","la liste des commandes déjà tapées"]],"tip":"Ctrl + C dans le terminal n'est pas « copier » : c'est « arrêter ». Dans Git Bash : sélectionner à la souris copie, **Shift + Insert** colle. **Ctrl + R** puis quelques lettres retrouve une ancienne commande.","comp":true,"sec":"Se repérer et se déplacer","grp":"Le terminal"},{"id":"mkdir-touch","t":"Créer des dossiers et des fichiers","s":[["Créer un dossier","mkdir collecte"],["Plusieurs d'un coup (séparés par une espace)","mkdir data src notebooks"],["Créer un fichier vide","touch README.md"]],"tip":"Ni espace ni accent dans les noms : minuscules et tirets. Tu t'épargnes des guillemets toute l'année.","why":"`data/` reçoit les fichiers récupérés, `src/` les scripts, `notebooks/` les analyses : c'est l'organisation habituelle d'un projet data.","sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"projet-collecte","t":"Construire le dossier d'un projet, du début à la fin","s":[["Se placer dans Documents","cd ~/Documents"],["Créer le projet et y entrer","mkdir collecte\ncd collecte"],["Créer les sous-dossiers et le README","mkdir data src notebooks\ntouch README.md"],["Vérifier","ls"]],"tip":"Note le résultat de `pwd` : c'est le chemin à ouvrir ensuite dans VS Code.","sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"ranger-projets","t":"Ranger tous ses projets : une base DATA","s":[["Créer la base une fois pour toutes","cd ~/Documents\nmkdir -p DATA/01_Formation DATA/02_Projets DATA/03_Portfolio DATA/04_Ressources"],["Un nouveau projet va dans 02_Projets","cd ~/Documents/DATA/02_Projets\nmkdir analyse_ventes\ncd analyse_ventes\nmkdir data notebooks\ntouch README.md\ncode ."]],"tab":[["Dossier","Ce qu'il contient"],["`01_Formation/`","supports de cours, exercices"],["`02_Projets/`","les projets en cours (un dossier par projet)"],["`03_Portfolio/`","les travaux présentables"],["`04_Ressources/`","fiches, modèles, mémos"]],"tip":"Ne crée pas tous les dossiers par automatisme : `src/` est inutile pour un exercice 100 % notebook, et `.venv/` pour un exercice SQL. `mkdir -p` crée aussi les dossiers parents qui manquent.","comp":true,"sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"echo-cat","t":"Écrire et lire un fichier : echo, >, >>, cat","s":[["Écrire une ligne dans un fichier (le crée au besoin)","echo \"Semaine 8 - Terminal OK\" > notes.txt"],["Lire son contenu","cat notes.txt"],["Ajouter une ligne à la fin","echo \"Deuxième ligne\" >> notes.txt"],["Les premières / dernières lignes d'un fichier","head notes.txt"]],"trap":"Un seul `>` **écrase** tout le contenu, sans prévenir. Deux `>>` ajoutent à la fin.","why":"`echo` affiche du texte ; le chevron redirige cet affichage vers un fichier au lieu de l'écran. Taper une commande dans le terminal ne l'écrit pas dans un fichier.","sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"cp-mv-rm","t":"Copier, déplacer, renommer, supprimer","s":[["Copier","cp notes.txt sauvegarde.txt"],["Déplacer dans un dossier","mv sauvegarde.txt data/"],["Renommer (déplacer vers un nouveau nom)","mv fichier.txt fichier_renomme.txt"],["Supprimer un fichier","rm notes.txt"],["Supprimer un dossier et tout son contenu","rm -r terminal_exercice"],["Supprimer un dossier vide","rmdir vieux_dossier"]],"trap":"`rm` ne met rien à la corbeille : c'est immédiat et définitif. Tape `pwd` avant chaque `rm -r`, et ne supprime jamais un dossier depuis l'intérieur. Attention à l'espace de trop : `rm -r ~ /Documents` supprimerait tout ton dossier personnel.","sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"chercher","t":"Chercher un fichier ou un mot","s":[["Les fichiers .txt du dossier (l'étoile = n'importe quoi)","ls *.txt"],["Les lignes qui contiennent un mot","grep Terminal notes.txt"],["Un mot absent","grep Python notes.txt"],["Tous les fichiers .py, sous-dossiers compris","find . -name \"*.py\""],["Les fichiers .py qui contiennent « streamlit »","grep -l streamlit *.py"]],"tip":"Sous Unix, une commande qui réussit sans rien à dire ne dit rien. Le silence est une réponse.","sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"utiles-terminal","t":"Deux commandes pratiques","s":[["Ouvrir le dossier actuel dans VS Code","code ."],["Vider l'écran du terminal","clear"]],"sec":"Créer, lire, copier, supprimer","grp":"Le terminal"},{"id":"script","t":"Écrire et lancer un script .sh","lead":"Un script est un fichier qui contient des commandes : on l'exécute, elles se lancent les unes après les autres.","s":[["Le contenu de script.sh (écrit dans VS Code, puis Ctrl + S)","echo \"Début du script\"\nls\ncat notes.txt\necho \"Fin du script\""],["L'exécuter","bash script.sh"]],"trap":"Tant que le fichier n'est pas enregistré (point blanc sur l'onglet), le terminal lit l'ancienne version : un script vide ne fait rien, sans erreur.","why":"C'est exactement ce que tu feras avec un script Python : seuls le nom du fichier et la commande de lancement changent (`python src/script.py`).","sec":"Un premier script shell","grp":"Le terminal"},{"id":"vscode-pas-python","t":"VS Code n'est pas Python","tab":[["","Ce que c'est"],["VS Code","un éditeur (IDE) : il écrit des fichiers et lance des programmes, il ne sait pas calculer"],["Python","le langage, et le programme qui l'exécute : il s'installe à part, et VS Code va le chercher"]],"why":"Installer VS Code n'installe pas Python. Colab te donnait tout d'un coup ; sur ton ordinateur, chaque pièce est séparée.","sec":"Prendre ses repères","grp":"VS Code"},{"id":"ouvrir-dossier","t":"Ouvrir un dossier, jamais un fichier","lead":"Ou par le menu : **File → Open Folder…**, puis le dossier du projet.","s":[["Depuis le terminal, dans le dossier du projet","code ."]],"trap":"Si la barre latérale est vide, tu as ouvert un fichier seul (ou rien) : recommence avec un dossier.","why":"VS Code travaille sur un dossier entier : il voit tous tes fichiers, et son terminal s'ouvre au bon endroit. Le dossier ouvert devient la racine de tout : chemins, terminal, environnement, Git.","sec":"Prendre ses repères","grp":"VS Code"},{"id":"zones-vscode","t":"Les six zones de l'écran","tab":[["Zone","À quoi elle sert"],["Barre d'activité (tout à gauche)","Explorer, Search, Source Control (Git), Run and Debug, Extensions"],["Barre latérale","l'arborescence du projet"],["Éditeur","tes fichiers ouverts, en onglets"],["Minimap","un aperçu du fichier, pour naviguer vite"],["Panneau inférieur","le terminal et la console de débogage"],["Barre d'état (en bas)","le langage, la position, la branche Git, l'interpréteur Python"]],"sec":"Prendre ses repères","grp":"VS Code"},{"id":"raccourcis-vscode","t":"Les raccourcis à connaître","tab":[["Action","Raccourci"],["Palette de commandes","Ctrl + Shift + P"],["Ouvrir le terminal intégré","Ctrl + ù"],["Enregistrer","Ctrl + S"],["Extensions","Ctrl + Shift + X"],["Run and Debug","Ctrl + Shift + D"],["Exécuter une cellule de notebook","Ctrl + Entrée"],["Cellule en dessous / au-dessus","Échap puis B / A"]],"tip":"Tu ne trouves pas un réglage ? Ne cherche pas dans les menus : ouvre la palette et tape ce que tu veux (« Python », « terminal », « format »).","sec":"Prendre ses repères","grp":"VS Code"},{"id":"raccourcis-plus","t":"Raccourcis en plus, pour coder plus vite","tab":[["Action","Raccourci"],["Ouvrir un fichier par son nom","Ctrl + P"],["Chercher dans tout le projet","Ctrl + Shift + F"],["Commenter / décommenter les lignes sélectionnées","Ctrl + /"],["Déplacer la ligne vers le haut / le bas","Alt + ↑ / ↓"],["Dupliquer la ligne","Shift + Alt + ↓"]],"tip":"Ctrl + / met (ou enlève) un `#` devant chaque ligne sélectionnée : pratique pour désactiver un bout de code le temps d'un test.","comp":true,"sec":"Prendre ses repères","grp":"VS Code"},{"id":"extensions","t":"Installer les extensions Python et Jupyter","lead":"Barre latérale **Extensions** (Ctrl + Shift + X), chercher « Python », choisir celle de **Microsoft**, Install. Pareil pour **Jupyter**.","tip":"Une extension s'installe dans VS Code, pas dans ton projet : elle vaut pour tous tes projets.","why":"Sans l'extension Python, VS Code voit un fichier `.py` comme du texte. Elle apporte la coloration, l'auto-complétion, le signalement des erreurs, le débogueur et les notebooks.","sec":"Python et notebooks dans VS Code","grp":"VS Code"},{"id":"interpreteur","t":"Choisir le bon interpréteur Python","lead":"Palette (Ctrl + Shift + P) → **Python: Select Interpreter**.","tab":[["Situation","Ligne à choisir"],["Le projet n'a pas encore d'environnement","« Recommended » : le Python le plus récent de la machine"],["Le dossier contient un `.venv`","la ligne dont le chemin passe par ton projet (`.venv`)"],["Lignes Conda, defaultInterpreterPath","à ignorer : d'anciens environnements"]],"trap":"Le symptôme : `ModuleNotFoundError: No module named 'pandas'` alors que tu viens de l'installer. Tu ne l'as pas installé au mauvais endroit : tu l'exécutes au mauvais endroit. Regarde l'interpréteur affiché dans la barre d'état, en bas.","why":"Plusieurs Python peuvent coexister sur une machine (celui du système, d'Anaconda, de ton projet). VS Code en choisit un par défaut, et rien ne dit que c'est le bon.","sec":"Python et notebooks dans VS Code","grp":"VS Code"},{"id":"lancer-script","t":"Exécuter un script Python","s":[["Depuis le terminal intégré, à la racine du projet","python src/premier_script.py"]],"tip":"Le terminal intégré s'ouvre directement dans le dossier du projet : pas besoin de `cd`.","why":"Le bouton ▷ en haut à droite et « Run Python File » font la même chose, mais cachent la commande lancée. Au terminal, tu sais ce qui s'exécute, et tu sauras le refaire ailleurs.","sec":"Python et notebooks dans VS Code","grp":"VS Code"},{"id":"notebook-local","t":"Ses notebooks en local","lead":"Un `.ipynb` de Colab s'ouvre tel quel dans VS Code. Nouveau notebook : palette → **Create: New Jupyter Notebook**, puis **Select Kernel** en haut à droite.","s":[["Où le notebook s'exécute-t-il ?","import os\nprint(os.getcwd())"],["Lire un fichier depuis la racine du projet","df = pd.read_csv(\"data/mon_fichier.csv\")"],["Lire un fichier quand le notebook est dans notebooks/","df = pd.read_csv(\"../data/mon_fichier.csv\")"]],"trap":"Un chemin Colab comme `/content/mon_fichier.csv` ne marche plus en local. Et un notebook rangé dans `notebooks/` s'exécute depuis ce dossier : `data/…` y est introuvable, il faut `../data/…`. `os.getcwd()` te le dit.","why":"Plus besoin de réimporter tes fichiers à chaque session, et ce que tu enregistres reste sur ton disque. La limite : la puissance et la mémoire de ta machine.","sec":"Python et notebooks dans VS Code","grp":"VS Code"},{"id":"git-bash-vscode","t":"Git Bash comme terminal par défaut (Windows)","lead":"Palette → **Terminal: Select Default Profile** → **Git Bash**.","s":[["Ou dans les réglages JSON (Ctrl + , puis l'icône Open Settings (JSON))","\"terminal.integrated.profiles.windows\": {\n    \"Git Bash\": { \"path\": \"C:\\\\Program Files\\\\Git\\\\bin\\\\bash.exe\" }\n},"]],"why":"Par défaut, VS Code ouvre PowerShell sous Windows, qui ne parle pas la même langue que Git Bash.","sec":"Python et notebooks dans VS Code","grp":"VS Code"},{"id":"debogueur","t":"Le débogueur en trois gestes","tab":[["Geste","Comment"],["Poser un point d'arrêt","un clic dans la marge, à gauche du numéro de ligne : un point rouge apparaît"],["Lancer en mode débogage","F5 (ou Run and Debug → « Python File »)"],["Avancer d'une ligne","F10 (Step Over)"],["Entrer dans une fonction","F11 (Step Into)"],["Sortir de la fonction","Shift + F11 (Step Out)"],["Arrêter","Shift + F5"]],"tip":"Vérifie que l'extension **Python Debugger** de Microsoft est installée.","why":"Le programme s'arrête où tu veux, et le panneau de gauche montre toutes les variables à cet instant. Avec des `print`, on relance à chaque fois et on ne voit qu'une variable à la fois.","sec":"Déboguer sans print","grp":"VS Code"},{"id":"moyenne-cassee","t":"L'exemple du cours : le script qui ment","s":[["src/moyenne_cassee.py","def calculer_moyenne(notes):\n    total = 0\n    for note in notes[:-1]:\n        total += note\n    return total / len(notes)\n\nnotes_etudiants = [15, 12, 18, 9, 14]\nmoyenne = calculer_moyenne(notes_etudiants)\nprint(f\"La moyenne des notes est : {moyenne}\")"],["L'exécuter","python src/moyenne_cassee.py"]],"tip":"Un chiffre faux dans un calcul ? Point d'arrêt juste avant, et regarde les variables.","trap":"Le code ne plante pas : il se trompe. Point d'arrêt sur `total += note`, puis F10 à chaque tour : `note` ne vaut jamais 14. `notes[:-1]` oublie la dernière note.","sec":"Déboguer sans print","grp":"VS Code"},{"id":"pourquoi-venv","t":"Pourquoi un environnement par projet","tab":[["Sans environnement","Avec un environnement"],["une seule version de pandas sur la machine","chaque projet a sa propre copie des bibliothèques"],["le projet de janvier marchait avec la 1.5","les versions ne se croisent jamais"],["celui de mars exige la 2.2 : tu l'installes, janvier casse","tu installes sans rien casser ailleurs"]],"why":"Les bibliothèques évoluent, et dépendent d'autres bibliothèques (pandas s'appuie sur numpy). Un environnement fige une liste de bibliothèques avec leur version exacte, pour que le projet marche sur n'importe quel ordinateur.","sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"creer-venv","t":"Créer l'environnement","s":[["À la racine du projet (une fois par projet)","python -m venv .venv"],["Vérifier qu'il existe (dossier caché)","ls -a"]],"tip":"Vérifie ton `pwd` avant : sinon l'environnement est créé au mauvais endroit. Le nom `.venv`, avec un point, est la convention que VS Code et Git reconnaissent.","why":"Le dossier `.venv` contient un Python à lui (dans `Scripts/`) et accueillera les bibliothèques (dans `Lib/site-packages/`).","sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"activer-venv","t":"Activer, vérifier, désactiver","s":[["Activer (Git Bash)","source .venv/Scripts/activate"],["Activer : PowerShell (pour information)",".venv\\Scripts\\Activate.ps1"],["Vérifier quel Python est utilisé","python -c \"import sys; print(sys.executable)\""],["Désactiver","deactivate"]],"tip":"Activé ? Tu dois voir **(.venv)** au début de la ligne. C'est le seul signal visible.","trap":"Oublier `source` : la commande s'exécute à part et meurt aussitôt, sans erreur et sans effet. Et chaque nouveau terminal demande une nouvelle activation.","sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"pip","t":"Installer et regarder ses bibliothèques","s":[["La liste des bibliothèques installées","pip list"],["Installer","pip install pandas requests"],["Une version précise","pip install streamlit==1.41.1"],["Mettre à jour","pip install -U streamlit"],["La version installée d'une bibliothèque","pip show numpy"]],"why":"Juste après l'activation, `pip list` est presque vide : c'est la preuve de l'isolation. Les bibliothèques installées ailleurs sur ta machine ne sont pas visibles ici.","sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"python-m-pip","t":"python -m pip : être sûr d'installer au bon endroit","s":[["Installer avec le Python du terminal courant","python -m pip install pandas matplotlib"],["La liste, avec ce même Python","python -m pip list"],["Figer la liste","python -m pip freeze > requirements.txt"]],"why":"`pip` tout court peut appartenir à un autre Python que celui qui répond à `python`. `python -m pip` demande explicitement au Python actif de lancer pip : les bibliothèques arrivent forcément dans ce Python-là.","comp":true,"sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"venv-vscode","t":"Faire reconnaître l'environnement par VS Code","lead":"Palette → **Python: Select Interpreter** → la ligne dont le chemin contient `.venv`. Dans un notebook : **Select Kernel** → le même `.venv`.","tip":"Souvent, VS Code propose lui-même le nouvel environnement dans une fenêtre : réponds Yes.","trap":"Créer l'environnement ne suffit pas : sans ce choix, tes scripts tournent avec le Python global, et pandas reste introuvable.","sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"ipykernel","t":"Le notebook ne trouve pas mon environnement","s":[["Dans le terminal, environnement activé : ce qui fait tourner les notebooks","pip install ipykernel"],["Dans une cellule du notebook : installer dans le bon environnement","%pip install pandas"]],"trap":"Dans un notebook, préfère `%pip` à `!pip` : `%pip` installe dans le kernel du notebook, `!pip` peut installer dans un autre Python que celui qui exécute tes cellules.","why":"Pour qu'un notebook tourne avec ton `.venv`, il faut le paquet `ipykernel` dedans. VS Code propose souvent de l'installer tout seul : accepte.","comp":true,"sec":"Créer et activer son environnement","grp":"Environnement virtuel"},{"id":"freeze","t":"Figer, puis réinstaller la liste","s":[["Écrire la liste exacte des bibliothèques","pip freeze > requirements.txt"],["La relire","cat requirements.txt"],["Tout réinstaller depuis la liste","pip install -r requirements.txt"]],"trap":"`pip list > requirements.txt` donne un tableau avec en-tête et tirets, illisible par `pip install -r`. Seul `pip freeze` donne le bon format.","why":"On ne partage jamais le dossier `.venv` : il pèse lourd et ne marche que sur ta machine. On partage `requirements.txt`, léger et lisible : n'importe qui reconstruit le même environnement.","sec":"Partager : requirements.txt","grp":"Environnement virtuel"},{"id":"projet-clone-venv","t":"Faire tourner le projet de quelqu'un d'autre","s":[["1. Créer l'environnement","python -m venv .venv"],["2. L'activer (Git Bash)","source .venv/Scripts/activate"],["3. Installer ce que le projet demande","pip install -r requirements.txt"]],"why":"Après un `git clone`, le `.venv` n'est pas sur GitHub (il est dans le `.gitignore`). On le recrée, puis on rejoue la liste.","sec":"Partager : requirements.txt","grp":"Environnement virtuel"},{"id":"supprimer-venv","t":"Supprimer un environnement","s":[["Effacer le dossier (désactive-le d'abord)","rm -rf .venv"]],"trap":"`rm -rf` ne demande aucune confirmation et ne met rien à la corbeille. Vérifie ton `pwd` avant : un mauvais chemin après `-rf`, et tout disparaît.","why":"Désactiver ne libère pas de place. Un environnement peut peser plusieurs gigaoctets : pour récupérer l'espace, on supprime le dossier.","sec":"Partager : requirements.txt","grp":"Environnement virtuel"},{"id":"gd-trois","t":"Les trois vérifications qui tranchent","s":[["Dans le terminal : où pip installe, et ce qui est installé ici","pip -V\npip list"],["Dans le notebook : sur quel Python tourne le noyau","import sys; print(sys.executable)"],["Où est installée une bibliothèque précise (ligne Location)","pip show pandas"]],"why":"Si les trois chemins contiennent `.venv`, tout est en ordre. Dans neuf cas sur dix, `ModuleNotFoundError` après une installation réussie veut dire que le noyau du notebook ne pointe pas sur le `.venv` : corrige avec **Select Kernel**.","sec":"Pas à pas : Python ne trouve pas ma bibliothèque","grp":"Environnement virtuel"},{"id":"gd-checklist","t":"La checklist complète","tab":[["#","Question","Vérification"],["1","Suis-je dans le bon projet ?","`pwd`"],["2","L'environnement est-il actif ?","`(.venv)` au début de la ligne"],["3","Quel Python répond ?","`python -c \"import sys; print(sys.executable)\"`"],["4","La bibliothèque est-elle là ?","`pip list`"],["5","VS Code utilise-t-il le même ?","interpréteur (barre d'état) et kernel du notebook"]],"tip":"Le dossier ouvert, l'interpréteur des scripts et le kernel du notebook sont trois réglages distincts : les trois doivent pointer sur le même projet.","comp":true,"sec":"Pas à pas : Python ne trouve pas ma bibliothèque","grp":"Environnement virtuel"},{"id":"uv-equivalences","t":"pip et venv, ou uv : les équivalences","s":[["Installer uv","pip install uv"],["Créer un projet (dossier, .gitignore, pyproject.toml…)","uv init essai-uv"],["Ajouter une bibliothèque","uv add pandas"],["Exécuter sans activer","uv run python main.py"],["Reconstituer un projet cloné","uv sync"]],"tab":[["Avec pip et venv","Avec uv"],["`python -m venv .venv`","`uv venv`"],["`source .venv/Scripts/activate`","inutile : `uv run` s'en charge"],["`pip install pandas`","`uv add pandas`"],["`pip freeze > requirements.txt`","automatique, dans `pyproject.toml`"],["`pip install -r requirements.txt`","`uv sync`"]],"trap":"`uv init` crée aussi un dépôt Git (`.git`) : ne refais pas `git init` derrière, passe directement à `git status`.","why":"Mêmes notions, outil plus rapide (écrit en Rust) et une commande en moins. Un dépôt avec un `pyproject.toml` et sans `requirements.txt` est géré avec uv : `uv sync`.","sec":"Aller plus loin : uv","grp":"Environnement virtuel"},{"id":"config","t":"Se présenter à Git","s":[["Ce qui est déjà enregistré (rien = pas configuré)","git config --global user.name"],["Ton nom","git config --global user.name \"Prénom Nom\""],["Ton e-mail (le même que sur GitHub)","git config --global user.email \"ton.email@exemple.fr\""],["Appeler la branche principale main","git config --global init.defaultBranch main"],["Vérifier","git config --global --list"]],"trap":"Utilise l'adresse de ton compte GitHub, sinon tes commits ne te seront pas attribués.","why":"Git signe chaque commit avec ce nom et cette adresse : sans eux, ton premier commit s'arrête net (« Please tell me who you are »). `--global` veut dire « pour tous mes projets » : tu ne le retaperas jamais.","sec":"Configurer Git (une seule fois)","grp":"Git en local"},{"id":"git-vs-github","t":"Git n'est pas GitHub","tab":[["","Ce que c'est"],["Git","un programme sur ta machine : il gère l'historique, en local, sans connexion"],["GitHub","un site qui héberge des dépôts Git : partage, revue de code, vitrine, copie en ligne"]],"why":"Git fonctionne très bien sans GitHub. L'inverse n'existe pas.","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"git-init","t":"Transformer un dossier en dépôt","s":[["À la racine du projet, une seule fois","git init"]],"trap":"Jamais dans un sous-dossier, ni dans un dossier déjà versionné. Initialisé au mauvais endroit ? Supprime le `.git` qui s'y trouve et recommence au bon.","why":"`git init` ne crée qu'une chose : un dossier caché `.git`, qui contiendra tout l'historique. Tes fichiers ne sont ni déplacés ni modifiés. Supprimer `.git` efface l'historique, pas ton travail.","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"trois-zones","t":"Les trois zones","tab":[["Zone","Ce qu'elle contient","On y va avec"],["Répertoire de travail","tes fichiers, tels que tu les vois dans VS Code","(tu modifies)"],["Index (staging)","ce que tu as choisi pour le prochain commit","`git add`"],["HEAD (l'historique)","le dernier enregistrement validé","`git commit`"]],"tip":"Une image pour retenir : `add` = mettre des affaires dans le carton, `commit` = fermer le carton et écrire l'étiquette, `push` = expédier le carton sur GitHub, `pull` = recevoir les cartons des autres.","why":"Pourquoi une zone au milieu ? Pour qu'un commit raconte une seule chose. Tu as corrigé un bug et renommé des variables : l'index te permet de faire deux commits lisibles plutôt qu'un fourre-tout.","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"git-status","t":"git status, ta boussole","s":[["Où en est chaque fichier","git status"],["La version courte","git status -s"]],"tip":"Un dossier vide est invisible pour Git : il faut au moins un fichier dedans.","why":"`git status` ne modifie jamais rien, et Git y met entre parenthèses la commande à taper ensuite. Un développeur expérimenté la tape des dizaines de fois par jour.","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"git-add","t":"git add : choisir ce qui part","s":[["Préparer UN fichier","git add src/premier_script.py"],["Préparer tout le dossier (sauf ce qui est ignoré)","git add ."]],"trap":"`git add .` est pratique et dangereux : c'est par lui qu'on commite un fichier de 300 Mo ou un mot de passe. Relis `git status` juste après. Et un fichier modifié APRÈS son add garde l'ancienne version dans l'index : refais `add`.","why":"`add` ne sauvegarde rien : il sélectionne ce qui partira dans le prochain commit. Le `.` veut dire « tout ce qui est dans le dossier actuel et ses sous-dossiers ».","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"git-commit","t":"git commit : enregistrer et expliquer","s":[["Enregistrer avec un message","git commit -m \"Ajoute le premier script et le README\""],["Ajouter ET commiter les fichiers déjà suivis","git commit -am \"Precise le titre du README\""]],"trap":"Sans `-m`, Git ouvre un éditeur dans le terminal, et beaucoup s'y retrouvent coincés. Et `-am` ne voit pas les fichiers nouveaux.","why":"Un commit, c'est une photo complète du projet, un message qui dit pourquoi, et un lien vers le commit précédent. Ce n'est pas une sauvegarde : c'est une décision que tu documentes.","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"bons-messages","t":"Écrire un bon message de commit","tab":[["À éviter","À écrire"],["maj","Ajoute le filtre sur les dates"],["ça marche enfin","Corrige le calcul du panier moyen"],["modif fichier","Supprime les colonnes vides du CSV"],["WIP","Prépare la structure du script de collecte"]],"tip":"Le test : « Si j'applique ce commit, il va… » suivi de ton message. « … ajouter le filtre sur les dates » tient debout ; « … maj » non. D'où l'impératif, et moins de 50 caractères.","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"pastilles","t":"Lire les lettres : VS Code et git status -s","tab":[["Lettre","Où","Signification"],["U (vert)","VS Code","fichier nouveau, que Git ne suit pas encore"],["M (orange)","VS Code","fichier suivi, modifié depuis le dernier commit"],["A","VS Code","fichier préparé (après `git add`)"],["Nom grisé","VS Code","ignoré par le `.gitignore`"],["`??` rouge","`status -s`","nouveau, jamais ajouté"],["`M` rouge","`status -s`","modifié, pas encore ajouté"],["`M` vert","`status -s`","modifié et ajouté : prêt pour le commit"],["`A` vert","`status -s`","nouveau fichier ajouté"]],"tip":"Première colonne de `status -s` = l'index, seconde = ton répertoire de travail. Un fichier modifié n'apparaît pas ? Il n'est sans doute pas enregistré dans VS Code (point blanc sur l'onglet) : Ctrl + S.","trap":"Un fichier en `M` alors que tu croyais le créer ? Il existait déjà : tu l'as écrasé (un `to_csv` ne prévient pas).","sec":"Le cycle : status, add, commit","grp":"Git en local"},{"id":"gitignore-contenu","t":"Ce qu'on n'envoie jamais","s":[["Le fichier .gitignore, à la racine, AVANT le premier add",".env\n.venv/\ndata/\n__pycache__/\n.ipynb_checkpoints/\n.history/"]],"tab":[["Famille","Exemples","Pourquoi"],["Secrets","`.env`, clés d'API, mots de passe","compromis dès le premier push"],["Données","`data/`, gros CSV","trop lourd, et récupérable"],["Ce qui se recrée tout seul","`.venv/`, `__pycache__/`, `.ipynb_checkpoints/`","refait à chaque exécution"]],"tip":"La règle : secret, lourd, ou se recrée tout seul → `.gitignore`. Le nom au caractère près : un point devant, pas d'extension. Crée-le dans VS Code : le Bloc-notes ajoute `.txt` en silence.","trap":"Un fichier déjà commité ne disparaît pas de l'historique parce que tu l'ajoutes au `.gitignore` ensuite. Un mot de passe commité est compromis : on ne le rattrape pas, on le change. Et GitHub refuse les fichiers de plus de 100 Mo.","sec":"Le .gitignore","grp":"Git en local"},{"id":"check-ignore","t":"Vérifier qu'une règle s'applique","s":[["Quelle ligne du .gitignore filtre ces fichiers ?","git check-ignore -v .env data/brut.csv"]],"tip":"L'outil à sortir quand un fichier refuse d'apparaître (ou de disparaître) dans `git status`.","sec":"Le .gitignore","grp":"Git en local"},{"id":"gitkeep","t":"Garder un dossier vide dans le dépôt","s":[["Déposer un fichier vide dans le dossier","touch notebooks/.gitkeep"],["Le dossier apparaît enfin","git status -s"]],"why":"Git ne suit que des fichiers : un dossier vide est invisible, et ne part donc pas sur GitHub. `.gitkeep` n'a rien de spécial, c'est une convention : un fichier vide dont le nom dit à quoi il sert.","comp":true,"sec":"Le .gitignore","grp":"Git en local"},{"id":"rm-cached","t":"Arrêter de suivre un fichier déjà commité","s":[["Un fichier","git rm --cached fichier.csv"],["Un dossier entier","git rm --cached -r .venv"]],"why":"Le fichier reste sur ton disque, mais Git ne le suit plus. Ajoute-le ensuite au `.gitignore`, puis commit.","sec":"Le .gitignore","grp":"Git en local"},{"id":"git-log","t":"L'historique des commits","s":[["Une ligne par commit","git log --oneline"],["Avec la date","git log --oneline --format=\"%h %ad %s\" --date=short"],["Avec les branches dessinées","git log --oneline --graph --all"]],"tip":"Pour sortir d'un affichage long (log, diff) : touche **q**.","why":"Les sept caractères en tête sont l'identifiant court du commit : c'est par lui qu'on désigne un état précis du projet.","sec":"Relire : log, diff, show","grp":"Git en local"},{"id":"git-diff","t":"Ce qui a changé","s":[["Les modifications pas encore ajoutées","git diff"],["Ce qui est dans l'index, prêt à partir","git diff --staged"],["Le détail du dernier commit","git show"]],"trap":"« `git diff` ne montre rien » : tu as déjà fait `add`. `git diff` compare ton dossier à l'**index**, pas au dernier commit. Pour relire ce qui part : `git diff --staged`, juste avant chaque commit.","why":"Les lignes avec `+` sont ajoutées, celles avec `-` supprimées, les autres sont là pour le contexte.","sec":"Relire : log, diff, show","grp":"Git en local"},{"id":"gk-checklist","t":"La checklist en six questions","s":[["Où suis-je, sur quelle branche, qu'est-ce qui a changé ?","pwd\ngit branch --show-current\ngit status"],["Qu'est-ce qui va vraiment partir ?","git diff --staged"]],"tab":[["#","Question"],["1","`pwd` : suis-je dans le bon dossier ?"],["2","`git branch --show-current` : sur la bonne branche ?"],["3","`git status` : que vais-je enregistrer ?"],["4","`git diff --staged` : ai-je relu le contenu ?"],["5","`git add fichier` puis `git commit -m \"Message clair\"`"],["6","`git push` : ai-je besoin de publier maintenant ?"]],"why":"Avec deux copies d'un projet ouvertes, l'explorateur de VS Code peut afficher l'une pendant que le terminal est dans l'autre : chaque commande Git s'applique au dossier du terminal, pas au panneau de gauche.","sec":"Pas à pas : avant chaque commit et chaque push","grp":"Git en local"},{"id":"restore","t":"Annuler une modification","s":[["Remettre le fichier comme au dernier commit","git restore src/collecte.py"],["Retirer un fichier de l'index (l'inverse de add)","git restore --staged src/collecte.py"]],"tip":"Pas besoin de retenir ces deux commandes : `git status` te les affiche entre parenthèses, dans la situation où elles servent.","trap":"`git restore fichier` est **définitif** : les modifications annulées n'ont jamais été enregistrées, Git ne peut pas les retrouver. Relis le fichier avant.","sec":"Annuler, réparer","grp":"Git en local"},{"id":"amend-stash","t":"Corriger le dernier message, mettre de côté","s":[["Corriger le message du dernier commit","git commit --amend -m \"Nouveau message\""],["Mettre ses modifications de côté","git stash"],["Les récupérer","git stash pop"]],"trap":"`--amend` seulement si le commit n'a pas encore été poussé sur GitHub.","why":"`stash` sert surtout avant de changer de branche, quand tu n'es pas prêt à commiter.","sec":"Annuler, réparer","grp":"Git en local"},{"id":"oubli-commit","t":"J'ai oublié un fichier dans mon dernier commit","s":[["Ajouter le fichier oublié","git add oubli.txt"],["Le glisser dans le dernier commit, sans changer le message","git commit --amend --no-edit"]],"trap":"Seulement si le commit n'a pas encore été poussé : `--amend` remplace le commit par un nouveau, et GitHub refuserait ensuite ton push.","comp":true,"sec":"Annuler, réparer","grp":"Git en local"},{"id":"coince-editeur","t":"Coincé dans l'éditeur après un commit sans -m","lead":"Tu as tapé `git commit` sans `-m`, et le terminal affiche un écran plein de `~` : c'est l'éditeur Vim.","tab":[["Pour…","Tape"],["écrire ton message","la touche **i**, puis ton message"],["enregistrer et quitter (le commit est fait)","**Échap**, puis `:wq` et Entrée"],["quitter sans rien enregistrer (le commit est annulé)","**Échap**, puis `:q!` et Entrée"]],"tip":"Le plus simple reste de ne jamais l'ouvrir : toujours `git commit -m \"message\"`.","comp":true,"sec":"Annuler, réparer","grp":"Git en local"},{"id":"branche-quoi","t":"Ce qu'est une branche","s":[["Lister les branches (* = celle où tu es)","git branch"]],"tip":"Nomme-la avec un verbe ou un sujet, en minuscules, avec des tirets : `ajout-mediane`, `correction-dates`. Pas `test` ni `essai`.","why":"Une branche n'est pas une copie du projet : c'est une étiquette qui pointe sur un commit et avance à chaque nouveau commit. Les deux versions existent en même temps, tu passes de l'une à l'autre par une commande : rien n'est perdu, donc tu oses.","sec":"Les branches","grp":"Git en local"},{"id":"switch","t":"Créer une branche, changer de branche","s":[["CRÉER une branche et s'y placer","git switch -c ajout-mediane"],["CHANGER de branche","git switch main"],["Sur quelle branche suis-je ?","git branch --show-current"]],"tab":[["Syntaxe moderne","Ancienne syntaxe (même effet)"],["`git switch nom`","`git checkout nom`"],["`git switch -c nom`","`git checkout -b nom`"]],"trap":"Avant de changer de branche, commit (ou `git stash`) : sinon Git refuse, ou emporte tes modifications sur l'autre branche. `git status` doit être vide avant chaque `git switch`.","why":"`checkout` faisait trop de choses (changer de branche, restaurer un fichier…). Git l'a scindé en `switch` pour les branches et `restore` pour les fichiers. Tu verras encore `checkout` dans beaucoup de tutoriels.","sec":"Les branches","grp":"Git en local"},{"id":"merge","t":"Fusionner une branche terminée","s":[["1. Se placer sur la branche qui REÇOIT","git switch main"],["2. Fusionner celle qui donne","git merge ajout-mediane"]],"tip":"Le sens de la commande est le sens du travail : on fusionne vers `main`, jamais l'inverse.","why":"Fast-forward : `main` n'avait pas bougé pendant ton travail, Git avance simplement l'étiquette. C'est le cas le plus fréquent quand on travaille seul.","sec":"Les branches","grp":"Git en local"},{"id":"supprimer-branche-locale","t":"Supprimer une branche fusionnée","s":[["Supprimer (seulement si elle est fusionnée)","git branch -d titre-long titre-court"],["Forcer, même non fusionnée","git branch -D ma-branche"]],"trap":"`-D` majuscule force la suppression : le travail non fusionné est perdu. Si `-d` refuse, vérifie avec `git log` avant d'insister.","why":"Tes commits restent : ils ont été intégrés à `main`. Tu ne supprimes que l'étiquette.","sec":"Les branches","grp":"Git en local"},{"id":"conflit-voir","t":"Reconnaître un conflit","s":[["La deuxième fusion modifie la même ligne","git merge titre-court"],["Lire la situation","git status"]],"why":"Un conflit survient quand la même ligne a changé des deux côtés. Rien n'est cassé, rien n'est perdu : Git s'arrête et refuse de choisir à ta place.","sec":"Les conflits","grp":"Git en local"},{"id":"conflit-marqueurs","t":"Lire les marqueurs","s":[["Ce que tu trouves dans README.md","<<<<<<< HEAD\n# Portfolio Data Analyst — promotion 2026\n=======\n# Mon portfolio\n>>>>>>> titre-court"]],"tab":[["Marqueur","Ce qu'il délimite"],["`<<<<<<< HEAD`","début de TA version (la branche où tu es)"],["`=======`","la frontière entre les deux"],["`>>>>>>> titre-court`","fin de la version de la branche que tu fusionnes"]],"tip":"`HEAD`, c'est toujours « là où je suis ». Dans VS Code, quatre boutons au-dessus du bloc : Accept Current Change, Accept Incoming, Accept Both, Compare Changes.","sec":"Les conflits","grp":"Git en local"},{"id":"conflit-resoudre","t":"Résoudre, puis valider","s":[["1. Éditer le fichier : garder la bonne version, effacer les 3 marqueurs","# Portfolio Data Analyst — promotion 2026"],["2. Le fichier est encore en conflit","git status -s"],["3. Dire à Git « c'est réglé »","git add README.md"],["4. Valider la fusion avec le message proposé","git commit --no-edit"],["5. Voir le dessin de la fusion","git log --oneline --graph --all"]],"trap":"L'erreur classique : oublier un marqueur. Avant de commiter, cherche `<<<<` dans le fichier. Un `=======` resté dans un .py donne une erreur de syntaxe.","why":"`UU` = Unmerged : tant que tu n'as pas fait `git add`, Git considère le fichier en conflit.","sec":"Les conflits","grp":"Git en local"},{"id":"merge-abort","t":"La porte de sortie","s":[["Tout remettre comme avant la fusion","git merge --abort"]],"tip":"Retiens-la maintenant, pas au moment de la panique : tant que tu n'as pas commité, un conflit n'engage à rien.","sec":"Les conflits","grp":"Git en local"},{"id":"notebooks-equipe","t":"Les notebooks en équipe","trap":"Les conflits sur les `.ipynb` sont pénibles à résoudre (le fichier est du JSON illisible). Évitez de modifier le même notebook en même temps.","sec":"Les conflits","grp":"Git en local"},{"id":"deux-depots","t":"Deux dépôts, pas un","tab":[["Commande","Sens","Ce qu'elle fait"],["`git push`","local → GitHub","envoie tes commits"],["`git pull`","GitHub → local","récupère et applique les commits des autres"],["`git fetch`","GitHub → local","récupère sans appliquer : tu regardes avant"],["`git clone`","GitHub → local","crée une copie complète d'un dépôt existant"]],"why":"Tu n'envoies pas tes fichiers « quelque part » : tu obtiens un second dépôt complet, et tu synchronises les deux quand tu le décides. `commit` enregistre, `push` publie : ce sont deux décisions.","sec":"Local et distant","grp":"GitHub et équipe"},{"id":"qui-est-qui","t":"origin, main, origin/main : qui est qui ?","tab":[["Nom","Ce que c'est"],["`origin`","le surnom du dépôt sur GitHub (l'adresse distante)"],["`main`","la branche principale, sur ton ordinateur"],["`origin/main`","la dernière version connue de `main` sur GitHub"],["`marco_b`","ta branche, sur ton ordinateur"]],"sec":"Local et distant","grp":"GitHub et équipe"},{"id":"creer-depot","t":"Créer le dépôt sur GitHub","lead":"Sur GitHub : **New** (ou + en haut à droite → New repository). Nom = celui du dossier, une phrase de description, **Public** pour un portfolio.","trap":"Ne coche **aucune** case d'initialisation (README, .gitignore) si tu as déjà un projet local : les deux historiques n'auraient aucun commit en commun, et ton premier push serait refusé. Un dépôt distant naît vide quand le local existe déjà.","sec":"Local et distant","grp":"GitHub et équipe"},{"id":"jeton","t":"Le jeton : ton mot de passe ne marchera pas","lead":"Photo de profil → **Settings** → **Developer settings** → **Personal access tokens** → **Tokens (classic)** → **Generate new token (classic)**.","s":[["Au premier push, Git demande","Username: ton-pseudo\nPassword:"],["Ne plus le retaper (machine personnelle seulement)","git config --global credential.helper store"]],"tab":[["Champ","Valeur"],["Note","`portfolio-bootcamp` (pour savoir à quoi il sert)"],["Expiration","90 jours"],["Scopes","**repo** uniquement"]],"trap":"GitHub n'affiche le jeton **qu'une fois** : copie-le tout de suite. C'est un mot de passe : jamais dans un fichier du projet ni dans un message. Exposé ? Supprime-le sur la même page.","why":"Depuis 2021, GitHub refuse le mot de passe du compte au push. Rien ne s'affiche quand tu colles le jeton : c'est normal, le terminal masque les mots de passe.","sec":"Local et distant","grp":"GitHub et équipe"},{"id":"remote-add","t":"Relier son projet à GitHub","s":[["Relier (adresse copiée depuis le bouton vert Code → HTTPS)","git remote add origin URL_DU_DEPOT"],["Vérifier : 2 lignes « origin »","git remote -v"],["Nommer la branche main","git branch -M main"]],"trap":"Pas de chevrons `< >` autour de l'URL. Et on ne tape jamais l'adresse à la main : on la copie.","why":"`origin` est un surnom : la convention universelle pour « le dépôt distant principal ».","sec":"Relier et envoyer","grp":"GitHub et équipe"},{"id":"premier-push","t":"Le premier envoi","s":[["Envoyer et retenir le lien (une seule fois)","git push -u origin main"],["Les fois suivantes","git push"]],"why":"`-u` relie ta branche locale à celle de GitHub : ensuite, `git push` tout court suffit.","sec":"Relier et envoyer","grp":"GitHub et équipe"},{"id":"remote-erreurs","t":"Réparer le lien","s":[["Mauvaise URL : la corriger","git remote set-url origin BONNE_URL"],["Repartir de zéro","git remote remove origin"],["Push refusé : le distant a des commits que tu n'as pas","git pull --rebase origin main"]],"tip":"« remote origin already exists » : tu as déjà déclaré un distant. Vérifie avec `git remote -v`, puis `set-url` plutôt que d'en ajouter un second.","why":"`--rebase` repose tes commits par-dessus ceux du distant, au lieu de créer une fusion inutile. Ensuite : `git push -u origin main`.","sec":"Relier et envoyer","grp":"GitHub et équipe"},{"id":"gp-dossier","t":"1. Le dossier du projet","lead":"Les commandes sont pour Git Bash. Dans VS Code : terminal intégré (Ctrl + ù), puis Git Bash dans la petite flèche à droite du +.","s":[["Créer le dossier, y entrer, l'ouvrir dans VS Code","cd ~/Documents\nmkdir nom-du-projet\ncd nom-du-projet\ncode ."]],"tip":"Nom sans accent ni espace (minuscules et tirets) : il servira aussi de nom au dépôt GitHub.","why":"VS Code s'ouvre sur le dossier : reprends ensuite le terminal intégré de cette nouvelle fenêtre. Il s'ouvre directement au bon endroit.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-venv","t":"2. L'environnement virtuel, et la vérification","s":[["Créer et activer","python -m venv .venv\nsource .venv/Scripts/activate"],["Vérifier : les deux chemins doivent contenir .venv","which python\npip -V"]],"trap":"Recommence l'activation avant d'installer quoi que ce soit : sinon tout part dans le Python global, sans aucun message.","why":"Tu dois voir **(.venv)** au début de la ligne. `which python` dit quel Python répond, `pip -V` où pip installe : si le chemin ne contient pas `.venv`, l'activation n'a pas pris.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-deps","t":"3. Les bibliothèques et la structure","s":[["Installer ce dont le projet a besoin (ipykernel : pour les notebooks)","pip install pandas notebook ipykernel"],["Créer la structure","mkdir data notebooks src"],["Contrôler : une liste courte = environnement isolé","pip list"]],"trap":"Une liste de deux cents paquets veut dire que tu installes dans le Python global, pas dans ton projet.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-kernel","t":"4. Le notebook et son noyau (kernel)","lead":"Crée `notebooks/analyse.ipynb` dans l'explorateur de VS Code. En haut à droite : **Select Kernel** → celui dont le chemin contient `.venv`.","s":[["Première cellule : vérifier le Python et le dossier de travail","import sys, os\nprint(sys.executable)\nprint(os.getcwd())"],["Le notebook tourne depuis notebooks/ : on remonte d'un dossier pour lire les données","df = pd.read_csv(\"../data/ventes.csv\")"]],"trap":"Le noyau du notebook est indépendant du terminal. Oublié, il donne le symptôme le plus déroutant : `pip install` répond « Successfully installed », et la cellule suivante « No module named pandas ».","why":"`sys.executable` doit contenir `.venv` ; `os.getcwd()` se termine par `notebooks`. Les deux points `..` remontent d'un dossier.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-git-local","t":"5. Git en local : identité, .gitignore, premier commit","s":[["Git me connaît-il ? (rien ne s'affiche = pas configuré)","git config --global user.name\ngit config --global user.email"],["Sinon, se présenter (avec l'adresse du compte GitHub)","git config --global user.name \"Prénom Nom\"\ngit config --global user.email \"ton.adresse@exemple.fr\""],["Contenu du fichier .gitignore, à la racine",".venv/\n__pycache__/\n.ipynb_checkpoints/\n.history/\n.env"],["Initialiser et contrôler : .venv/ ne doit PAS apparaître","git init\ngit status"],["Figer les bibliothèques, puis le premier commit","pip freeze > requirements.txt\ngit add .\ngit commit -m \"Mise en place du projet\""]],"tip":"Et `data/` ? Ça dépend du projet : on l'ignore si c'est lourd ou récupérable, on le garde si les CSV sont le résultat de ton travail.","trap":"Crée le `.gitignore` dans VS Code, pas avec le Bloc-notes, qui ajoute en silence `.txt` à la fin. Si `.venv/` apparaît dans `git status`, le `.gitignore` n'est pas à la racine ou contient une faute de frappe : corrige avant de continuer.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-github","t":"6. Le dépôt GitHub, strictement vide","tab":[["Champ","Ce que tu mets"],["Repository name","le nom du dossier, sans accent ni espace (GitHub remplace le reste par des tirets)"],["Visibilité","Public"],["Add a README","décoché"],["Add .gitignore","None"],["Choose a license","None"]],"why":"Un dépôt qui contient déjà un fichier a son propre historique : ton push serait refusé pour « historiques divergents ».","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-push","t":"7. Relier et envoyer","s":[["Relier (URL copiée depuis GitHub, collée telle quelle), puis envoyer","git remote add origin URL_COPIEE_DEPUIS_GITHUB\ngit branch -M main\ngit push -u origin main"],["Contrôler : deux lignes commençant par origin","git remote -v"]],"tip":"Au push, une fenêtre d'authentification s'ouvre : choisis **Sign in with your browser** si elle le propose. Sous Windows, le gestionnaire d'identification s'en souvient ensuite. Sinon, c'est le jeton (fiche « Le jeton »).","trap":"Colle l'URL sans chevrons `< >` ni guillemets. Pour le terminal, `<` veut dire « lis ce fichier » : tu obtiendrais `bash: syntax error near unexpected token`, puis `fatal: 'origin' does not appear to be a git repository` au push.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"gp-quotidien","t":"8. Le quotidien, ensuite","s":[["Chaque séance","git pull\ngit add .\ngit commit -m \"Message explicite\"\ngit push"],["J'installe une nouvelle bibliothèque : régénérer la liste, puis la pousser","pip freeze > requirements.txt\ngit add requirements.txt\ngit commit -m \"Ajoute seaborn aux dépendances\"\ngit push"],["Mon binôme récupère et installe","git pull\npip install -r requirements.txt"]],"trap":"`pip freeze >` écrase le fichier : si ton binôme avait une bibliothèque que tu n'as pas, elle disparaît de la liste sans un mot.","why":"Le `git pull` d'ouverture, avant de coder, évite la grande majorité des conflits à plusieurs.","sec":"Pas à pas : du dossier vide à GitHub","grp":"GitHub et équipe"},{"id":"pull-fetch","t":"pull ou fetch ?","s":[["Récupérer ET intégrer (95 % du temps)","git pull"],["Récupérer sans rien toucher","git fetch"],["Les commits de GitHub que je n'ai pas encore","git log --oneline main..origin/main"],["Où j'en suis par rapport à GitHub","git status"]],"tip":"Le réflexe : `git pull` avant de travailler, et avant de pousser. Trente secondes au début contre une demi-heure de conflits à la fin.","why":"`git pull` = `git fetch` (télécharger) + fusionner dans ta branche. `fetch` seul te laisse regarder avant d'intégrer.","sec":"Récupérer : pull, fetch, clone","grp":"GitHub et équipe"},{"id":"clone","t":"Récupérer un projet existant : clone","s":[["Se placer là où ranger le projet","cd ~/Documents/data/02_Projets"],["Copier tout le projet et son historique","git clone URL_DU_DEPOT"],["Entrer dans le dossier créé","cd nom_du_depot"]],"tip":"Le bouton Download ZIP donne les fichiers sans l'historique : pas de log, pas de branches, impossible de contribuer. Après un clone, recrée le `.venv` puis `pip install -r requirements.txt`.","trap":"Ne jamais cloner à l'intérieur d'un autre dépôt Git : toujours dans un dossier « neutre ». Et pas de `git init` ni de `remote add` derrière : clone les a déjà faits.","sec":"Récupérer : pull, fetch, clone","grp":"GitHub et équipe"},{"id":"branche-camarade","t":"Tester la branche d'un camarade sur ma machine","s":[["Récupérer les nouveautés, branches comprises","git fetch"],["Voir aussi les branches de GitHub","git branch -a"],["Aller sur sa branche (copie locale créée toute seule)","git switch sa-branche"],["Revenir sur la mienne","git switch marco_b"],["Oublier les branches supprimées sur GitHub","git fetch --prune"]],"trap":"Commit (ou `git stash`) avant de changer de branche : sinon Git refuse, pour ne pas écraser tes modifications.","why":"`git switch` sur une branche qui n'existe que sur GitHub crée la copie locale et la relie à `origin/sa-branche`. Tu lances son code, tu vérifies, et tu reviens sur ta branche sans rien avoir mélangé.","comp":true,"sec":"Récupérer : pull, fetch, clone","grp":"GitHub et équipe"},{"id":"modifier-github","t":"Modifier un fichier depuis le navigateur","lead":"Sur GitHub, ouvrir le fichier → icône crayon → modifier → un vrai message → **Commit changes**. Puis en local : `git pull`.","why":"L'interface web fait un vrai commit, avec auteur, message et date. Pratique pour une faute dans un README ; pour du code, reste en local (ton éditeur, tes tests).","sec":"Récupérer : pull, fetch, clone","grp":"GitHub et équipe"},{"id":"gc-clone","t":"1. Cloner au bon endroit","s":[["Se placer dans un dossier « neutre » (pas dans un autre dépôt)","cd ~/Documents\npwd"],["Copier le projet et tout son historique","git clone URL_DU_DEPOT"],["Ou en choisissant le nom du dossier créé","git clone URL_DU_DEPOT python_test_clone"],["Entrer dans le dossier et contrôler le lien et l'historique","cd python_test_clone\ngit remote -v\ngit log --oneline -5"]],"trap":"Jamais à l'intérieur d'un autre dépôt Git. Vérifie avec `pwd` avant de cloner.","why":"`clone` crée le dossier, télécharge tout l'historique et configure `origin` : pas de `git init` ni de `remote add` derrière.","sec":"Pas à pas : cloner un projet et le faire tourner","grp":"GitHub et équipe"},{"id":"gc-venv","t":"2. Recréer l'environnement (il n'est pas sur GitHub)","s":[["Créer, activer, réinstaller la liste du projet","python -m venv .venv\nsource .venv/Scripts/activate\npip install -r requirements.txt"],["Contrôler le Python utilisé","python -c \"import sys; print(sys.executable)\""],["Le projet a un pyproject.toml et pas de requirements.txt ? Il est géré avec uv","uv sync"]],"tip":"Dans VS Code : **Python: Select Interpreter** et, pour un notebook, **Select Kernel** → le `.venv` du projet cloné.","why":"Le `.venv` est dans le `.gitignore` : un clone ne le récupère jamais. C'est voulu : on partage la liste (`requirements.txt`), et chac
